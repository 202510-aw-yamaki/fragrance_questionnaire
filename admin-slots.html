<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>&#20104;&#32004;&#26528; | Fragrance Workshop</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin-common.css">
</head>
<body class="page-canvas admin-page">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main site-container admin-grid cols-2">
    <section class="admin-panel">
      <p class="section-label">Slots</p>
      <h1>&#20104;&#32004;&#26528;</h1>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>&#26085;&#20184;</th>
              <th>&#26178;&#38291;</th>
              <th>&#34920;&#31034;&#12521;&#12505;&#12523;</th>
              <th>&#25285;&#24403;</th>
              <th>status</th>
              <th>&#23450;&#21729;</th>
              <th>&#20844;&#38283;</th>
              <th>&#25805;&#20316;</th>
            </tr>
          </thead>
          <tbody id="slot-rows"></tbody>
        </table>
      </div>
    </section>

    <section class="admin-panel">
      <h2>&#26032;&#35215;&#20316;&#25104; / &#32232;&#38598;</h2>
      <form class="admin-form" id="slot-form">
        <input id="slot-id" type="hidden">
        <label>slot_code<input id="slot-code" type="text" required></label>
        <label>&#26085;&#20184;<input id="slot-date" type="date" required></label>
        <label>&#26178;&#38291;<input id="slot-time" type="time" required></label>
        <label>&#34920;&#31034;&#12521;&#12505;&#12523;<input id="slot-label" type="text" required></label>
        <label>&#25285;&#24403;&#12473;&#12479;&#12483;&#12501;<input id="slot-instructor" type="text"></label>
        <label>status
          <select id="slot-status">
            <option value="open">open</option>
            <option value="recommended">recommended</option>
            <option value="closed">closed</option>
          </select>
        </label>
        <label>capacity<input id="slot-capacity" type="number" min="1" value="1"></label>
        <label>sort_order<input id="slot-sort" type="number" min="0" value="0"></label>
        <label><input id="slot-active" type="checkbox" checked> is_active</label>
        <div class="admin-actions">
          <button class="admin-btn primary" type="submit">&#20445;&#23384;</button>
          <button class="admin-btn secondary" id="slot-reset" type="button">&#20837;&#21147;&#12434;&#12463;&#12522;&#12450;</button>
        </div>
      </form>
    </section>

    <section class="admin-panel" style="grid-column: 1 / -1;">
      <div class="admin-card-head">
        <div>
          <h2>&#12471;&#12501;&#12488;&#12363;&#12425;&#20104;&#32004;&#26528;&#12434;&#19968;&#25324;&#20316;&#25104;</h2>
          <p class="admin-note">&#20986;&#21220;&#26178;&#38291;&#24111;&#12395;&#21512;&#12431;&#12379;&#12390;&#12289;&#26085;&#20184;&#31684;&#22258;&#12392;&#26178;&#38291;&#38291;&#38548;&#12363;&#12425;&#20104;&#32004;&#26528;&#12434;&#12414;&#12392;&#12417;&#12390;&#20316;&#25104;&#12375;&#12414;&#12377;&#12290;&#21516;&#12376; <code>slot_code</code> &#12399;&#19978;&#26360;&#12365;&#12373;&#12428;&#12414;&#12377;&#12290;</p>
        </div>
      </div>
      <form class="admin-form" id="slot-bulk-form">
        <div class="admin-grid cols-4">
          <label>&#38283;&#22987;&#26085;<input id="slot-bulk-start-date" type="date" required></label>
          <label>&#32066;&#20102;&#26085;<input id="slot-bulk-end-date" type="date" required></label>
          <label>&#38283;&#22987;&#26178;&#21051;<input id="slot-bulk-start-time" type="time" required></label>
          <label>&#32066;&#20102;&#26178;&#21051;<input id="slot-bulk-end-time" type="time" required></label>
        </div>
        <div class="admin-grid cols-4">
          <label>&#26528;&#38291;&#38548;&#65288;&#20998;&#65289;<input id="slot-bulk-interval" type="number" min="15" step="15" value="60" required></label>
          <label>&#23450;&#21729;<input id="slot-bulk-capacity" type="number" min="1" step="1" value="1"></label>
          <label>&#25285;&#24403;&#12473;&#12479;&#12483;&#12501;<input id="slot-bulk-instructor" type="text" placeholder="&#20363;: &#23665;&#30000;"></label>
          <label>status
            <select id="slot-bulk-status">
              <option value="open">open</option>
              <option value="recommended">recommended</option>
              <option value="closed">closed</option>
            </select>
          </label>
        </div>
        <div class="admin-grid cols-3">
          <label>&#12471;&#12501;&#12488;&#21517;<input id="slot-bulk-label" type="text" value="&#25509;&#23458;&#26528;" required></label>
          <label>&#12467;&#12540;&#12489;&#25509;&#38957;&#36766;<input id="slot-bulk-prefix" type="text" value="SHIFT"></label>
          <label>&#38283;&#22987; sort_order<input id="slot-bulk-sort-start" type="number" min="0" step="1" value="0"></label>
        </div>
        <fieldset class="admin-editor-card">
          <legend>&#20316;&#25104;&#26332;&#26085;</legend>
          <div class="admin-grid cols-4">
            <label><input type="checkbox" name="slot-bulk-weekday" value="1" checked> &#26376;</label>
            <label><input type="checkbox" name="slot-bulk-weekday" value="2" checked> &#28779;</label>
            <label><input type="checkbox" name="slot-bulk-weekday" value="3" checked> &#27700;</label>
            <label><input type="checkbox" name="slot-bulk-weekday" value="4" checked> &#26408;</label>
            <label><input type="checkbox" name="slot-bulk-weekday" value="5" checked> &#37329;</label>
            <label><input type="checkbox" name="slot-bulk-weekday" value="6"> &#22303;</label>
            <label><input type="checkbox" name="slot-bulk-weekday" value="0"> &#26085;</label>
          </div>
        </fieldset>
        <div class="admin-actions">
          <button class="admin-btn primary" type="submit">&#12414;&#12392;&#12417;&#12390;&#20316;&#25104; / &#26356;&#26032;</button>
        </div>
        <p class="admin-note" id="slot-bulk-status-note">&#20316;&#25104;&#24460;&#12399;&#12371;&#12398;&#30011;&#38754;&#12434;&#20877;&#35501;&#12415;&#36796;&#12415;&#12375;&#12390;&#19968;&#35239;&#12408;&#21453;&#26144;&#12375;&#12414;&#12377;&#12290;</p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-data.js"></script>
  <script src="js/admin-slots-page.js"></script>
  <script src="js/admin-slots-bulk-page.js"></script>
</body>
</html>
