<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>&#20104;&#32004;&#26528; | Fragrance Workshop</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin-common.css">
  <link rel="stylesheet" href="css/admin-rebuild.css">
</head>
<body class="page-canvas admin-page portal-slots-page">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main site-container portal-stack portal-slots-stack">
    <section class="admin-panel portal-hero portal-slots-hero">
      <div class="portal-hero-copy-block">
        <p class="portal-hero-label">DASHBOARD</p>
        <h1>予約枠作成ページ</h1>
      </div>
      <p class="portal-hero-copy portal-hero-copy--align-end">予約枠の作成及び一括での枠作成が可能です</p>
    </section>

    <section class="portal-slot-layout portal-slot-layout--reference">
      <section class="admin-panel portal-slot-list-panel">
        <div class="portal-slot-card-head">
          <div>
            <p class="portal-hero-label portal-hero-label--muted">SLOTS</p>
            <h2>予約枠一覧</h2>
          </div>
        </div>
        <div class="portal-list-head portal-slot-head">
          <span>年月日</span>
          <span>時間</span>
          <span>定員</span>
          <span>総組数</span>
        </div>
        <div id="slot-rows" class="portal-list-body portal-slot-list-body"></div>
      </section>

      <section class="admin-panel portal-slot-editor-panel">
        <div class="portal-slot-card-head">
          <div>
            <h2>新規作成 / 編集</h2>
          </div>
        </div>
        <form class="admin-form portal-slot-form portal-slot-form--reference" id="slot-form">
          <input id="slot-id" type="hidden">
          <input id="slot-code" type="hidden">
          <input id="slot-label" type="hidden">
          <input id="slot-sort" type="hidden" value="0">
          <input id="slot-active" type="checkbox" checked hidden>
          <input id="slot-instructor" type="hidden">
          <select id="slot-status" hidden>
            <option value="open">公開中</option>
            <option value="recommended">おすすめ表示</option>
            <option value="closed">非公開</option>
          </select>
          <label class="portal-slot-field">
            <span>日付</span>
            <input id="slot-date" type="date" required>
          </label>
          <label class="portal-slot-field">
            <span>開始時間</span>
            <input id="slot-time" type="time" required>
          </label>
          <label class="portal-slot-field">
            <span>枠間隔（分）</span>
            <input id="slot-interval" type="number" min="15" step="15" value="120">
          </label>
          <label class="portal-slot-field">
            <span>定員</span>
            <input id="slot-capacity" type="number" min="1" value="6">
          </label>
          <div class="admin-actions portal-slot-card-actions">
            <button class="admin-btn primary" type="submit">保存</button>
            <button class="admin-btn secondary" id="slot-reset" type="button">入力をクリア</button>
          </div>
        </form>
      </section>

      <section class="admin-panel portal-slot-preview-panel">
        <div class="portal-slot-card-head">
          <div>
            <h2>入力/選択中の枠プレビュー</h2>
            <p class="admin-note portal-slot-inline-note" id="slot-preview-label">未入力</p>
          </div>
        </div>
        <div class="portal-slot-preview-fields">
          <div class="portal-slot-preview-field">
            <span>日付</span>
            <strong id="slot-preview-date">-</strong>
          </div>
          <div class="portal-slot-preview-field">
            <span>開始時間</span>
            <strong id="slot-preview-time">-</strong>
          </div>
          <div class="portal-slot-preview-field">
            <span>枠間隔（分）</span>
            <strong id="slot-preview-interval">120分</strong>
          </div>
          <div class="portal-slot-preview-field">
            <span>定員</span>
            <strong id="slot-preview-capacity">6名</strong>
          </div>
          <div class="portal-slot-preview-hidden" hidden>
            <strong id="slot-preview-staff">-</strong>
            <strong id="slot-preview-status">-</strong>
          </div>
        </div>
        <div class="admin-actions portal-slot-card-actions">
          <button class="admin-btn secondary" id="slot-preview-focus" type="button">編集</button>
          <button class="admin-btn secondary" id="slot-delete" type="button">枠削除</button>
        </div>
      </section>
    </section>

    <section class="admin-panel portal-bulk-panel portal-bulk-panel--slots">
      <div class="portal-slot-card-head">
        <div>
          <h2>予約枠を一括作成</h2>
          <p class="admin-note">日付範囲と時間間隔から予約枠をまとめて作成します。</p>
        </div>
      </div>
      <form class="admin-form portal-bulk-form portal-bulk-form--slots" id="slot-bulk-form">
        <input id="slot-bulk-end-time" type="hidden">
        <input id="slot-bulk-instructor" type="hidden">
        <input id="slot-bulk-label" type="hidden" value="接客枠">
        <input id="slot-bulk-prefix" type="hidden" value="SHIFT">
        <input id="slot-bulk-sort-start" type="hidden" value="0">
        <select id="slot-bulk-status" hidden>
          <option value="open" selected>公開中</option>
          <option value="recommended">おすすめ表示</option>
          <option value="closed">非公開</option>
        </select>
        <div class="portal-bulk-grid">
          <label class="portal-slot-field">
            <span>開始日</span>
            <input id="slot-bulk-start-date" type="date" required>
          </label>
          <label class="portal-slot-field">
            <span>終了日</span>
            <input id="slot-bulk-end-date" type="date" required>
          </label>
          <label class="portal-slot-field">
            <span>開始時刻</span>
            <input id="slot-bulk-start-time" type="time" required>
          </label>
          <label class="portal-slot-field">
            <span>枠間隔（分）</span>
            <input id="slot-bulk-interval" type="number" min="15" step="15" value="120" required>
          </label>
          <label class="portal-slot-field">
            <span>定員</span>
            <input id="slot-bulk-capacity" type="number" min="1" step="1" value="6">
          </label>
        </div>
        <fieldset class="admin-editor-card portal-weekday-card portal-weekday-card--slots">
          <legend>作成曜日</legend>
          <div class="portal-weekday-grid">
            <label><input type="checkbox" name="slot-bulk-weekday" value="1" checked> 月</label>
            <label><input type="checkbox" name="slot-bulk-weekday" value="2" checked> 火</label>
            <label><input type="checkbox" name="slot-bulk-weekday" value="3" checked> 水</label>
            <label><input type="checkbox" name="slot-bulk-weekday" value="4" checked> 木</label>
            <label><input type="checkbox" name="slot-bulk-weekday" value="5" checked> 金</label>
            <label><input type="checkbox" name="slot-bulk-weekday" value="6"> 土</label>
            <label><input type="checkbox" name="slot-bulk-weekday" value="0"> 日</label>
          </div>
        </fieldset>
        <div class="admin-actions portal-slot-card-actions">
          <button class="admin-btn primary" type="submit">まとめて作成 / 更新</button>
        </div>
        <div class="portal-bulk-feedback">
          <p class="admin-note" id="slot-bulk-preview-count">未計算</p>
          <p class="admin-note" id="slot-bulk-preview-range">日付を指定すると表示されます。</p>
          <p class="admin-note" id="slot-bulk-duplicate-preview">作成時に重複日を確認します。</p>
        </div>
        <p class="admin-note" id="slot-bulk-status-note">作成後はこの画面を再読み込みして一覧へ反映します。</p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-data.js"></script>
  <script src="js/admin-slots-page.js"></script>
  <script src="js/admin-slots-bulk-page.js"></script>
</body>
</html>
