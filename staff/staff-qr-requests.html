<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR依頼一覧 | Fragrance Workshop</title>
  <link rel="stylesheet" href="../assets/css/staff-ui.css">
</head>
<body class="staff-page" data-page="staff-qr-requests">
  <header class="admin-header" id="admin-header"></header>
  <main class="staff-main">
    <section class="admin-page-title"><div><span class="eyebrow">QR Requests</span><h1>QR依頼一覧</h1></div></section>
    <form class="portal-filter-form card" id="qr-request-filter-form">
      <label>状態<select id="qr-request-status-filter"><option value="">すべて</option><option value="requested">未対応</option><option value="available_email_sent">作成可能メール済み</option><option value="unavailable">作成不可</option><option value="shipping_pending">発送準備中</option><option value="shipped">発送完了</option><option value="auto_unavailable_overdue">期限超過不可</option></select></label>
      <label>検索<input id="qr-request-keyword-filter" type="search" placeholder="依頼番号・商品名・担当"></label>
    </form>
    <section class="section"><div id="qr-request-rows" class="portal-list-body"></div><p class="admin-empty" id="qr-request-empty" hidden>該当するQR依頼はありません。</p><p class="admin-note">表示件数: <span id="qr-request-count">0</span></p></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script src="../assets/js/admin-data.js"></script>
  <script src="../assets/js/qr-requests-page.js"></script>
</body>
</html>
