<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スタッフ顧客詳細 | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
</head>
<body class="staff-page" data-page="staff-customer-detail">
  <header class="staff-detail-header" id="staff-detail-header"></header>
  <main class="staff-main">
    <section class="admin-page-title"><div><span class="eyebrow">Customer Detail</span><h1>接客詳細</h1></div><button class="admin-btn primary" id="customer-edit-open" type="button">お客様情報を入力</button></section>
    <section class="grid-2">
      <article class="admin-panel"><h2>お客様</h2><div id="customer-profile"></div><h3>アンケート</h3><div id="question-summary"></div><div class="staff-answer-grid" id="question-answer-grid"></div></article>
      <article class="admin-panel"><h2>香り5軸</h2><div id="axis-compare"></div><h3>おすすめ原料</h3><div id="recommended-materials"></div></article>
    </section>
    <section class="staff-action-rail"><a class="staff-customer-action" href="#product-name">商品名</a><a class="staff-customer-action" href="#personal-info-consent">同意確認</a><a class="staff-customer-action" href="#recipe-list">配合</a></section>
    <form class="admin-form-stack section" id="staff-detail-form">
      <input id="session-record-id" type="hidden"><input id="submit-mode" type="hidden" value="draft"><input id="session-status" type="hidden" value="draft">
      <section class="grid-2"><label>準備メモ<textarea id="preparation-note"></textarea></label><label>接客メモ<textarea id="staff-summary"></textarea></label></section>
      <label>ヒアリングメモ<textarea id="hearing-note"></textarea></label>
      <section class="staff-soft-card staff-final-section" id="final-section">
        <div class="grid-2">
          <article><label>商品名<input id="product-name" type="text" maxlength="120"></label><label class="pill"><input id="personal-info-consent" type="checkbox"> 個人情報同意確認済み</label><label class="pill"><input id="third-party-order-consent" type="checkbox"> 第三者作成同意確認済み</label></article>
          <article><h3>QR表示</h3><div id="qr-preview" class="staff-qr-preview">QRコードがここに表示されます。</div></article>
        </div>
        <section><h3>最終配合</h3><button class="admin-btn secondary" id="add-recipe-row" type="button">行を追加</button><div class="staff-recipe-list" id="recipe-list"></div><button class="admin-btn secondary" id="normalize-recipe" type="button">割合を100%に整える</button></section>
        <section><h3>最終5軸</h3><div class="staff-axis-input-grid" id="final-axis-inputs"><label>フローラル<input id="axis-floral" type="number" min="0" max="100" step="1" value="0"></label><label>シトラス<input id="axis-fresh" type="number" min="0" max="100" step="1" value="0"></label><label>ウッディ<input id="axis-woody" type="number" min="0" max="100" step="1" value="0"></label><label>スパイシー<input id="axis-spicy" type="number" min="0" max="100" step="1" value="0"></label><label>スウィート<input id="axis-sweet" type="number" min="0" max="100" step="1" value="0"></label></div><p class="admin-note" id="axis-total">合計 0</p><div class="staff-axis-preview" id="final-axis-preview"></div></section>
        <label>仕上がりメモ<textarea id="customer-feedback"></textarea></label>
        <p class="status-note" id="save-status"></p>
        <div class="admin-actions"><button class="admin-btn secondary" id="save-draft" type="submit" form="staff-detail-form">途中保存</button><button class="admin-btn primary" id="save-complete" type="submit" form="staff-detail-form">最終登録</button><button class="admin-btn primary" id="generate-qr" type="button">QR表示</button></div>
      </section>
    </form>
  </main>
  <div class="portal-modal" id="customer-modal" hidden><div class="portal-modal-backdrop" data-customer-close></div><div class="portal-modal-dialog"><button class="admin-btn secondary" type="button" data-customer-close>閉じる</button><form class="admin-form" id="customer-form"><label>お名前<input id="customer-name" type="text" maxlength="80"></label><label>メール<input id="customer-email" type="email" maxlength="120"></label><label>電話<input id="customer-phone" type="text" maxlength="40"></label><label class="pill"><input id="customer-consent" type="checkbox"> 個人情報確認済み</label><button class="admin-btn primary" type="submit">保存</button></form></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-data.js"></script>
  <script src="../js/fragrance-master-data.js"></script>
  <script src="../js/staff-customer-detail-page.js"></script>
</body>
</html>
