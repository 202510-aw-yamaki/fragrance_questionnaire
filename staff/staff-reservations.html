<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スタッフ予約一覧 | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
</head>
<body class="staff-page" data-page="staff-reservations">
  <header class="admin-header" id="admin-header"></header>
  <main class="staff-main">
    <section class="admin-page-title"><div><span class="eyebrow">Reservations</span><h1>予約一覧</h1></div><label class="pill"><input id="filter-hide-completed" type="checkbox"> 完了済みを隠す</label></section>
    <form class="portal-filter-form card" id="filter-form">
      <div class="form-grid">
        <label class="field">日付<input id="filter-date" type="date"></label>
        <label class="field">状態<select id="filter-status"><option value="">すべて</option><option value="confirmed">予約済み</option><option value="completed">完了</option><option value="cancelled">取消</option></select></label>
        <label class="field">検索<input id="filter-keyword" type="text" placeholder="お客様名・傾向"></label>
      </div>
      <button class="admin-btn primary" type="submit">絞り込み</button>
    </form>
    <section class="section"><div id="reservation-rows" class="portal-list-body"></div><p class="admin-empty" id="reservation-empty" hidden>該当する予約はありません。</p></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-data.js"></script>
  <script src="../js/admin-reservations-page.js"></script>
</body>
</html>
