<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スタッフ登録 / 管理 | Fragrance Workshop</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin-common.css">
  <link rel="stylesheet" href="css/admin-rebuild.css">
</head>
<body class="page-canvas admin-page portal-admin-settings-page">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main site-container portal-stack">
    <section class="admin-panel portal-hero">
      <div class="portal-hero-copy-block">
        <p class="portal-hero-label">STAFF CONTROL</p>
        <h1>スタッフ新規登録 / 管理</h1>
      </div>
      <p class="portal-hero-copy portal-hero-copy--align-end">本日の出勤者、登録済みスタッフ、向こう一週間のカレンダーを同じ画面で確認しながら管理します。</p>
    </section>

    <section class="portal-control-grid">
      <article class="admin-panel portal-settings-today-panel">
        <div class="portal-section-head">
          <div>
            <h2>本日（<span id="settings-today-label">--/--</span>）の出勤者</h2>
          </div>
        </div>
        <div class="admin-card-list" id="settings-today-staff"></div>
      </article>

      <article class="admin-panel portal-side-stack portal-settings-side-card">
        <div class="portal-section-head">
          <div>
            <h2>スタッフ登録 / 編集</h2>
          </div>
        </div>
        <div class="portal-action-stack portal-settings-action-stack">
          <button class="admin-btn primary" id="staff-create-button" type="button">スタッフ新規登録</button>
          <label class="portal-settings-select">
            <span>スタッフ出勤管理</span>
            <select id="staff-manage-select"></select>
          </label>
          <div class="portal-settings-inline-control">
            <button class="admin-btn secondary" id="staff-shift-button" type="button">個別勤務管理</button>
            <label class="portal-settings-select portal-settings-select--compact">
              <span>スタッフ選択</span>
              <select id="shift-manage-select"></select>
            </label>
          </div>
        </div>
        <p class="admin-note portal-settings-control-note" id="settings-control-note" hidden></p>
      </article>
    </section>

    <section class="admin-panel portal-settings-calendar-panel">
      <div class="portal-section-head portal-settings-calendar-head">
        <div class="portal-settings-calendar-copy">
          <h2>スタッフカレンダー表</h2>
          <p class="admin-note">向こう一週間分の出勤時間と、各スタッフの予約数 / 予約枠を表形式で表示されます。</p>
        </div>
        <div class="portal-settings-calendar-tools">
          <p class="admin-note" id="settings-calendar-range">表示期間: 基本向こう一週間が表示される</p>
          <div class="admin-actions portal-settings-week-actions">
            <button class="admin-btn secondary" id="settings-week-prev" type="button">◀前の週に戻る</button>
            <button class="admin-btn secondary" id="settings-week-next" type="button">次の週に送る▶</button>
          </div>
        </div>
      </div>
      <div class="portal-calendar-shell">
        <table class="portal-calendar-table">
          <thead id="settings-calendar-head"></thead>
          <tbody id="settings-calendar-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="portal-modal" id="staff-modal" hidden>
    <div class="portal-modal-backdrop" data-modal-close="staff-modal"></div>
    <div class="portal-modal-dialog portal-modal-dialog--wide">
      <div class="portal-section-head">
        <div>
          <p class="portal-hero-label portal-hero-label--muted">REGISTER</p>
          <h2 id="staff-modal-title">スタッフ新規登録</h2>
        </div>
        <button class="admin-btn secondary" type="button" data-modal-close="staff-modal">閉じる</button>
      </div>
      <form class="admin-form" id="staff-form">
        <input id="staff-id" type="hidden">
        <div class="admin-grid cols-2">
          <label>スタッフID
            <input id="staff-code" type="text" required placeholder="staff-001">
          </label>
          <label>表示名
            <input id="staff-name" type="text" required placeholder="香り 花子">
          </label>
        </div>
        <div class="admin-grid cols-3">
          <label>権限
            <select id="staff-role">
              <option value="staff">staff</option>
              <option value="manager">manager</option>
            </select>
          </label>
          <label>メールアドレス
            <input id="staff-email" type="email" placeholder="staff@example.com">
          </label>
          <label>電話番号
            <input id="staff-phone" type="text" placeholder="090-0000-0000">
          </label>
        </div>
        <div class="admin-grid cols-3">
          <label>カードカラー
            <input id="staff-color" type="color" value="#c78862">
          </label>
          <label>標準出勤
            <input id="staff-default-start" type="time" value="10:00">
          </label>
          <label>標準退勤
            <input id="staff-default-end" type="time" value="18:00">
          </label>
        </div>
        <section class="admin-panel admin-panel-soft">
          <div class="portal-section-head">
            <div>
              <h3>曜日ごとの基本出勤</h3>
              <p class="admin-note">個別出勤モーダルで日付単位の上書きができます。</p>
            </div>
          </div>
          <div class="portal-week-pattern" id="staff-weekly-pattern"></div>
        </section>
        <div class="admin-actions">
          <button class="admin-btn primary" type="submit">保存</button>
          <button class="admin-btn secondary" type="button" data-modal-close="staff-modal">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <div class="portal-modal" id="shift-modal" hidden>
    <div class="portal-modal-backdrop" data-modal-close="shift-modal"></div>
    <div class="portal-modal-dialog portal-modal-dialog--wide">
      <div class="portal-section-head">
        <div>
          <p class="portal-hero-label portal-hero-label--muted">SHIFT EDIT</p>
          <h2 id="shift-modal-title">個別出勤モーダル</h2>
        </div>
        <button class="admin-btn secondary" type="button" data-modal-close="shift-modal">閉じる</button>
      </div>
      <form class="admin-form" id="shift-form">
        <input id="shift-staff-id" type="hidden">
        <label class="portal-checkbox">
          <input id="shift-extend-weeks" type="checkbox">
          <span>
            <strong>翌週も追加で表示する</strong>
            <small>チェックすると 2 週間分までモーダルを伸ばして表示します。</small>
          </span>
        </label>
        <div class="portal-shift-grid" id="shift-rows"></div>
        <div class="admin-actions">
          <button class="admin-btn primary" type="submit">個別出勤を保存</button>
          <button class="admin-btn secondary" type="button" data-modal-close="shift-modal">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-data.js"></script>
  <script src="js/admin-settings-page.js"></script>
</body>
</html>
