<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>その他設定 | Fragrance Workshop</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin-common.css">
</head>
<body class="page-canvas admin-page">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main site-container admin-grid cols-2">
    <section class="admin-panel">
      <p class="section-label">Settings</p>
      <h1>その他設定</h1>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>setting_key</th><th>setting_value</th><th>編集</th></tr></thead>
          <tbody id="settings-rows"></tbody>
        </table>
      </div>
    </section>
    <section class="admin-panel">
      <h2>設定を保存</h2>
      <form class="admin-form" id="settings-form">
        <input id="setting-id" type="hidden">
        <label>setting_key<input id="setting-key" type="text" required placeholder="store_info"></label>
        <label>setting_value (JSON)<textarea id="setting-value" rows="10">{}</textarea></label>
        <div class="admin-actions">
          <button class="admin-btn primary" type="submit">保存</button>
        </div>
      </form>
      <p class="admin-note">例: 店舗名、住所、予約時注意文言、予約完了ページ補足文言、担当候補一覧など。</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-data.js"></script>
  <script>
    const rowsEl = document.getElementById("settings-rows");
    const form = document.getElementById("settings-form");

    function fillForm(row) {
      document.getElementById("setting-id").value = row.id || "";
      document.getElementById("setting-key").value = row.setting_key || "";
      document.getElementById("setting-value").value = JSON.stringify(row.setting_value || {}, null, 2);
    }

    async function getAllSettings() {
      return window.AdminData.listRows("admin_settings", { orders: [{ column: "updated_at", ascending: false }] }).catch(() => []);
    }

    async function renderRows() {
      const rows = await getAllSettings();
      rowsEl.innerHTML = "";
      rows.forEach((row) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.setting_key || ""}</td>
          <td><pre style="white-space:pre-wrap;margin:0;">${JSON.stringify(row.setting_value || {}, null, 2)}</pre></td>
          <td><button class="admin-btn secondary" data-edit-id="${row.id}" type="button">編集</button></td>
        `;
        rowsEl.appendChild(tr);
      });
      rowsEl.querySelectorAll("[data-edit-id]").forEach((button) => {
        button.addEventListener("click", async () => {
          const rows = await getAllSettings();
          const target = rows.find((row) => row.id === button.dataset.editId);
          if (target) fillForm(target);
        });
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = {
        setting_key: document.getElementById("setting-key").value.trim(),
        setting_value: JSON.parse(document.getElementById("setting-value").value || "{}"),
        updated_at: new Date().toISOString()
      };
      const id = document.getElementById("setting-id").value;
      if (id) {
        await window.AdminData.updateRow("admin_settings", id, payload).catch(console.error);
      } else {
        await window.AdminData.insertRow("admin_settings", payload).catch(console.error);
      }
      form.reset();
      document.getElementById("setting-value").value = "{}";
      await renderRows();
    });

    async function bootstrap() {
      window.AdminAuth.renderAdminHeader("settings");
      const session = await window.AdminAuth.requireAdminSession();
      if (!session) return;
      await renderRows();
    }
    bootstrap();
  </script>
</body>
</html>
