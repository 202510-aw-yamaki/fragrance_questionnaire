<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配点ロジック管理 | Fragrance Workshop</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin-common.css">
</head>
<body class="page-canvas admin-page">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main site-container admin-grid">
    <section class="admin-panel">
      <p class="section-label">Scoring Config</p>
      <h1>配点ロジック</h1>
      <p class="admin-note">フォームの数値を調整すると、保存用 JSON は自動更新されます。公開側は active version を読み込みます。</p>
      <div class="admin-grid cols-3">
        <article class="admin-kpi"><span>active version</span><strong id="active-version">-</strong></article>
        <article class="admin-kpi"><span>note</span><strong id="active-note" style="font-size:1rem;">-</strong></article>
        <article class="admin-kpi"><span>updated</span><strong id="active-updated" style="font-size:1rem;">-</strong></article>
      </div>
      <div class="admin-actions">
        <button class="admin-btn secondary" id="scoring-load-template" type="button">研究レポート初期テンプレートを読込</button>
        <button class="admin-btn secondary" id="scoring-load-active" type="button">active 設定へ戻す</button>
      </div>
      <p class="admin-note" id="scoring-status">読み込み中です。</p>
    </section>
    <section class="admin-grid cols-2">
      <article class="admin-panel">
        <div class="admin-card-head">
          <div>
            <h2>フォーム編集</h2>
            <p class="admin-note">非エンジニア向けに、質問ごとの配点を表形式で編集できます。</p>
          </div>
        </div>
        <div class="admin-form-stack" id="scoring-editor"></div>
      </article>
      <article class="admin-panel">
        <div class="admin-card-head">
          <div>
            <h2>保存内容の確認</h2>
            <p class="admin-note">JSON は確認用です。保存すると新しい version が作られます。</p>
          </div>
        </div>
        <form class="admin-form" id="scoring-form">
          <label>version メモ<input id="scoring-note" type="text" placeholder="例: spring update"></label>
          <label>保存される JSON<textarea id="scoring-json" rows="24" readonly></textarea></label>
          <div class="admin-actions">
            <button class="admin-btn primary" type="submit">新 version として保存</button>
          </div>
        </form>
        <div class="admin-grid" id="scoring-sections"></div>
      </article>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-data.js"></script>
  <script src="js/fragrance-master-data.js"></script>
  <script src="js/admin-scoring-page.js"></script>
</body>
</html>
