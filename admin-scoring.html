<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配点ロジック管理 | Fragrance Workshop</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin-common.css">
</head>
<body class="page-canvas admin-page">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main site-container admin-grid">
    <section class="admin-panel">
      <p class="section-label">Scoring Config</p>
      <h1>配点ロジック</h1>
      <p class="admin-note">fallback は `questionnaire.html` の `MASTER_SCORING_CONFIG` です。本番運用では active config をここで更新します。</p>
      <div class="admin-grid cols-3">
        <article class="admin-kpi"><span>active version</span><strong id="active-version">-</strong></article>
        <article class="admin-kpi"><span>note</span><strong id="active-note" style="font-size:1rem;">-</strong></article>
        <article class="admin-kpi"><span>updated</span><strong id="active-updated" style="font-size:1rem;">-</strong></article>
      </div>
    </section>
    <section class="admin-grid cols-2">
      <article class="admin-panel">
        <h2>編集セクションの見取り図</h2>
        <div class="admin-grid" id="scoring-sections"></div>
      </article>
      <article class="admin-panel">
        <form class="admin-form" id="scoring-form">
          <label>version メモ<input id="scoring-note" type="text" placeholder="例: spring update"></label>
          <label>設定 JSON<textarea id="scoring-json" rows="26"></textarea></label>
          <div class="admin-actions">
            <button class="admin-btn primary" type="submit">新 version として保存</button>
          </div>
        </form>
      </article>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-data.js"></script>
  <script>
    let activeConfigRow = null;
    const sectionMount = document.getElementById("scoring-sections");
    const scoringJson = document.getElementById("scoring-json");

    function renderConfigSections(config) {
      const sections = [
        ["初期値 / 重み", { initialAxisScore: config.initialAxisScore, questionWeights: config.questionWeights }],
        ["STEP1 配点", { step1PrimaryAxes: config.step1PrimaryAxes, step1ScoreMap: config.step1ScoreMap }],
        ["branchTemplates", { branchTemplates: config.branchTemplates, branchDistanceWeights: config.branchDistanceWeights }],
        ["STEP2 配点", { step2PrimaryAxes: config.step2PrimaryAxes, step2ScoreMap: config.step2ScoreMap }],
        ["Q8 / finishTemplates", { q8PrimaryAxes: config.q8PrimaryAxes, q8ScoreMap: config.q8ScoreMap, finishKeyByAnswer: config.finishKeyByAnswer, finishTemplates: config.finishTemplates, finishBlendRatio: config.finishBlendRatio }],
        ["summaryProfiles", { summaryProfiles: config.summaryProfiles }]
      ];
      sectionMount.innerHTML = "";
      sections.forEach(([title, payload]) => {
        const card = document.createElement("section");
        card.className = "admin-panel";
        card.innerHTML = `<h3>${title}</h3><pre style="white-space:pre-wrap;margin:0;">${JSON.stringify(payload, null, 2)}</pre>`;
        sectionMount.appendChild(card);
      });
    }

    async function loadActiveConfig() {
      const rows = await window.AdminData.listRows("scoring_configs", { filters: [{ operator: "eq", column: "is_active", value: true }], orders: [{ column: "version", ascending: false }], limit: 1 }).catch(() => []);
      activeConfigRow = rows[0] || null;
      document.getElementById("active-version").textContent = activeConfigRow?.version ?? "-";
      document.getElementById("active-note").textContent = activeConfigRow?.note ?? "-";
      document.getElementById("active-updated").textContent = activeConfigRow?.updated_at ? String(activeConfigRow.updated_at).slice(0, 16).replace("T", " ") : "-";
      scoringJson.value = JSON.stringify(activeConfigRow?.config_json || {}, null, 2);
      renderConfigSections(activeConfigRow?.config_json || {});
    }

    scoringJson.addEventListener("input", () => {
      try {
        renderConfigSections(JSON.parse(scoringJson.value || "{}"));
      } catch (error) {
        // JSON 途中入力中は無視
      }
    });

    document.getElementById("scoring-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const configJson = JSON.parse(scoringJson.value || "{}");
      const note = document.getElementById("scoring-note").value.trim();
      const nextVersion = Number(activeConfigRow?.version || 0) + 1;
      if (activeConfigRow?.id) {
        await window.AdminData.updateRow("scoring_configs", activeConfigRow.id, { is_active: false, updated_at: new Date().toISOString() }).catch(console.error);
      }
      await window.AdminData.insertRow("scoring_configs", {
        config_key: `fragrance_master_v${nextVersion}`,
        version: nextVersion,
        is_active: true,
        config_json: configJson,
        note: note || null,
        updated_at: new Date().toISOString()
      }).catch(console.error);
      document.getElementById("scoring-note").value = "";
      await loadActiveConfig();
    });

    async function bootstrap() {
      window.AdminAuth.renderAdminHeader("scoring");
      const session = await window.AdminAuth.requireAdminSession();
      if (!session) return;
      await loadActiveConfig();
    }
    bootstrap();
  </script>
</body>
</html>
