<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>予約情報管理 | Fragrance Workshop</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin-common.css">
</head>
<body class="page-canvas admin-page">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main site-container admin-grid">
    <section class="admin-panel">
      <p class="section-label">Reservations</p>
      <h1>予約情報一覧ページ</h1>
      <p class="admin-note">予約コードは一覧では表示せず、来店日時・内容・状態から確認します。</p>
      <form class="admin-form" id="filter-form">
        <div class="admin-grid cols-3">
          <label>来店日<input id="filter-date" type="date"></label>
          <label>status
            <select id="filter-status">
              <option value="">すべて</option>
              <option value="confirmed">confirmed</option>
              <option value="canceled">canceled</option>
              <option value="completed">completed</option>
            </select>
          </label>
          <label>キーワード<input id="filter-keyword" type="text" placeholder="来店内容・傾向・メモ"></label>
        </div>
        <div class="admin-actions">
          <button class="admin-btn primary" type="submit">絞り込む</button>
        </div>
      </form>
    </section>
    <section class="admin-panel">
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>来店日時</th><th>来店目的</th><th>人数</th><th>傾向</th><th>作成日時</th><th>予約情報状態</th><th>詳細</th></tr></thead>
          <tbody id="reservation-rows"></tbody>
        </table>
      </div>
      <p class="admin-empty" id="reservation-empty" hidden>該当する予約はありません。</p>
    </section>
    <section class="admin-panel" id="detail-panel">
      <div class="admin-card-head">
        <div>
          <h2>選択中の予約</h2>
          <p class="admin-note" id="reservation-detail-summary">一覧から詳細を開くとここに予約概要を表示します。</p>
        </div>
        <a class="admin-inline-link" id="reservation-detail-link" href="admin-workspace.html">予約顧客情報詳細ページへ</a>
      </div>
      <div class="admin-card-list" id="reservation-detail-meta"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-data.js"></script>
  <script src="js/admin-reservations-page.js"></script>
</body>
</html>
