<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>素材テンプレート管理 | Fragrance Workshop</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin-common.css">
</head>
<body class="page-canvas admin-page">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main site-container admin-grid">
    <section class="admin-panel">
      <p class="section-label">Material Points</p>
      <h1>素材テンプレート管理</h1>
      <p class="admin-note">JSON ではなく、一覧カードと数値入力で素材テンプレートを管理します。`deep-research-report.md` の16原料はボタンひとつで初期投入できます。</p>
      <div class="admin-grid cols-3">
        <article class="admin-kpi"><span>登録件数</span><strong id="materials-kpi-total">-</strong></article>
        <article class="admin-kpi"><span>公開中</span><strong id="materials-kpi-active">-</strong></article>
        <article class="admin-kpi"><span>初期テンプレート</span><strong id="materials-kpi-template">16</strong></article>
      </div>
      <div class="admin-actions">
        <button class="admin-btn primary" id="material-seed-btn" type="button">16原料テンプレートを一括反映</button>
      </div>
      <p class="admin-note" id="material-seed-status">初期テンプレートを入れると、同じ code は上書きされます。</p>
    </section>
    <section class="admin-grid cols-2">
      <article class="admin-panel">
        <div class="admin-card-head">
          <div>
            <h2>登録済み一覧</h2>
            <p class="admin-note" id="material-count">0件を表示中</p>
          </div>
        </div>
        <div class="admin-grid cols-2">
          <label>検索<input id="material-search" type="text" placeholder="名称・code・分類で検索"></label>
          <label>分類<select id="material-filter"><option value="">すべて</option><option value="Top">Top</option><option value="Middle">Middle</option><option value="Last">Last</option></select></label>
        </div>
        <div class="admin-card-list" id="material-rows"></div>
      </article>
      <article class="admin-panel">
        <div class="admin-card-head">
          <div>
            <h2>新規作成 / 編集</h2>
            <p class="admin-note">テンプレートを選ぶと入力欄へ自動展開されます。</p>
          </div>
        </div>
        <form class="admin-form" id="material-form">
          <input id="material-id" type="hidden">
          <div class="admin-grid cols-2">
            <label>初期テンプレート<select id="material-template-select"></select></label>
            <div class="admin-actions admin-actions-inline">
              <button class="admin-btn secondary" id="material-template-apply" type="button">フォームへ反映</button>
            </div>
          </div>
          <label>管理コード<input id="material-code" type="text" required></label>
          <label>表示名<input id="material-name" type="text" required></label>
          <div class="admin-grid cols-2">
            <label>分類<input id="material-category" type="text" placeholder="Top / Middle / Last"></label>
            <label>表示順<input id="material-sort" type="number" value="0" step="1"></label>
          </div>
          <div class="admin-axis-edit-grid">
            <label>フローラル<input id="axis-floral" type="number" value="0" step="1"></label>
            <label>フレッシュ<input id="axis-fresh" type="number" value="0" step="1"></label>
            <label>ウッディ<input id="axis-woody" type="number" value="0" step="1"></label>
            <label>スパイシー<input id="axis-spicy" type="number" value="0" step="1"></label>
            <label>スウィート<input id="axis-sweet" type="number" value="0" step="1"></label>
          </div>
          <p class="admin-note" id="material-total">現在の合計: 0</p>
          <label>運用メモ<textarea id="material-note" rows="4"></textarea></label>
          <label><input id="material-active" type="checkbox" checked> 公開する</label>
          <div class="admin-actions">
            <button class="admin-btn primary" type="submit">保存</button>
            <button class="admin-btn secondary" id="material-reset" type="button">入力をクリア</button>
          </div>
        </form>
      </article>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-data.js"></script>
  <script src="js/fragrance-master-data.js"></script>
  <script src="js/admin-materials-page.js"></script>
</body>
</html>
