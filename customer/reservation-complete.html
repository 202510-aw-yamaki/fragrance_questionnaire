<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>予約完了 | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
</head>
<body data-page="reservation-complete">
  <header class="site-header">
    <div class="site-header-inner site-container"><a class="brand" href="../index.html"><span class="brand-mark">✦</span><span>Fragrance Workshop</span></a></div>
  </header>
  <main class="page-hero">
    <div class="page-shell grid-2">
      <section>
        <span class="eyebrow">Reservation Complete</span>
        <h1>予約を受け付けました</h1>
        <p class="page-copy">当日はアンケート結果をもとに、スタッフと一緒に香りを仕上げます。</p>
        <a class="btn secondary" id="hero-map-link" href="../index.html#faq">アクセスを見る</a>
      </section>
      <section class="detail-card">
        <h2 id="detail-status-label">予約内容</h2>
        <button class="btn secondary" id="detail-toggle" type="button">詳細表示</button>
        <div id="detail-body">
          <p>日時: <strong id="reservation-slot">-</strong></p>
          <p>お名前: <strong id="reservation-name">-</strong></p>
          <p>メール: <strong id="reservation-email">-</strong></p>
          <p>種別: <strong id="reservation-visit-type">-</strong></p>
          <p>人数: <strong id="reservation-guests">-</strong></p>
          <p id="memo-item">メモ: <span id="reservation-memo"></span></p>
        </div>
        <p class="admin-note">自動移動まで <span id="countdown-seconds">-</span></p>
        <button class="btn secondary" id="stay-here-btn" type="button">このページに留まる</button>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/public-data.js"></script>
  <script src="../js/rebuild-customer-flow.js"></script>
</body>
</html>
