<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会員比較モード | Fragrance Workshop</title>
  <link rel="stylesheet" href="../assets/css/rebuild-ui.css">
  <link rel="stylesheet" href="../assets/css/customer/customer-fragrance-compare.css">
</head>
<body data-page="fragrance-compare" class="fragrance-compare-page">
  <header class="site-header">
    <div class="site-header-inner site-container">
      <a class="brand compare-brand" href="../index.html"><span class="brand-logo-mark"><img src="../assets/img/customer/吟ロゴ.png" alt=""></span><span>Fragrance Workshop</span></a>
      <a class="compare-header-link" href="index.html">会員TOP</a>
    </div>
  </header>

  <main class="compare-main">
    <div class="compare-shell">
      <section class="compare-title">
        <h1 id="compare-page-title">前回と今回の香り比較</h1>
        <p id="compare-page-lead">前回の完成品と今回のアンケート結果を並べて、香りの変化を確認できます。</p>
      </section>
      <section class="compare-layout" aria-label="香り比較">
        <div class="compare-main-column">
          <section class="compare-radar-card" aria-label="前回と今回の5軸比較">
            <article class="compare-radar-panel compare-radar-panel--previous">
              <h2 id="compare-previous-name">前回の完成品</h2>
              <p id="compare-previous-meta">表示できる５軸データがありません。</p>
              <svg class="compare-radar" viewBox="0 0 360 360" role="img" aria-label="前回の香り5軸">
                <g id="compare-previous-grid" fill="none" stroke="#e5c08f"></g>
                <g id="compare-previous-lines" stroke="#e5c08f"></g>
                <g id="compare-previous-labels" fill="#4a3325" font-size="15" text-anchor="middle"></g>
                <polygon id="compare-previous-shape" fill="rgba(137,150,110,.18)" stroke="#89966e" stroke-width="3"></polygon>
                <g id="compare-previous-dots" fill="#89966e"></g>
              </svg>
            </article>

            <article class="compare-radar-panel compare-radar-panel--current">
              <h2 id="compare-current-name">今回のアンケート結果</h2>
              <p id="compare-current-meta">アンケート回答後に表示されます</p>
              <svg class="compare-radar" viewBox="0 0 360 360" role="img" aria-label="今回の香り5軸">
                <g id="compare-current-grid" fill="none" stroke="#e5c08f"></g>
                <g id="compare-current-lines" stroke="#e5c08f"></g>
                <g id="compare-current-labels" fill="#4a3325" font-size="15" text-anchor="middle"></g>
                <polygon id="compare-current-shape" fill="rgba(228,128,128,.23)" stroke="#e48188" stroke-width="3"></polygon>
                <g id="compare-current-dots" fill="#e48188"></g>
              </svg>
              <button class="compare-reset-button" id="compare-reset-button" type="button">初期値に戻す</button>
            </article>
          </section>

          <section class="compare-delta-card" aria-label="5軸の変化">
            <div class="compare-action-column">
              <a class="compare-primary-action" id="compare-reserve-link" href="reservation.html">この香りで予約する</a>
              <a class="compare-secondary-action" href="fragrance-graph.html">通常結果ページへ戻る</a>
              <button class="compare-detail-action" id="compare-detail-open" type="button">詳細を確認する</button>
            </div>
            <div class="compare-delta-list" id="compare-delta-list"></div>
          </section>
        </div>
      </section>
    </div>
  </main>

  <div class="compare-modal" id="compare-detail-modal" role="dialog" aria-modal="true" aria-labelledby="compare-detail-title" hidden>
    <div class="compare-modal-backdrop" data-compare-detail-close></div>
    <section class="compare-modal-panel">
      <button class="compare-modal-close" type="button" aria-label="閉じる" data-compare-detail-close>×</button>
      <div class="compare-card-heading">
        <h2 id="compare-detail-title">香りの詳細比較</h2>
        <span class="compare-divider" aria-hidden="true"></span>
      </div>
      <div class="compare-modal-radars" aria-label="前回と今回の5軸グラフ">
        <article class="compare-modal-radar-panel compare-modal-radar-panel--previous">
          <p class="compare-kicker">前回の完成品</p>
          <svg class="compare-radar" viewBox="0 0 360 360" role="img" aria-label="前回の詳細5軸">
            <g id="compare-modal-previous-grid" fill="none" stroke="#e5c08f"></g>
            <g id="compare-modal-previous-lines" stroke="#e5c08f"></g>
            <g id="compare-modal-previous-labels" fill="#4a3325" font-size="15" text-anchor="middle"></g>
            <polygon id="compare-modal-previous-shape" fill="rgba(137,150,110,.18)" stroke="#89966e" stroke-width="3"></polygon>
            <g id="compare-modal-previous-dots" fill="#89966e"></g>
          </svg>
        </article>
        <article class="compare-modal-radar-panel compare-modal-radar-panel--current">
          <p class="compare-kicker">今回の診断結果</p>
          <svg class="compare-radar" viewBox="0 0 360 360" role="img" aria-label="今回の詳細5軸">
            <g id="compare-modal-current-grid" fill="none" stroke="#e5c08f"></g>
            <g id="compare-modal-current-lines" stroke="#e5c08f"></g>
            <g id="compare-modal-current-labels" fill="#4a3325" font-size="15" text-anchor="middle"></g>
            <polygon id="compare-modal-current-shape" fill="rgba(228,128,128,.23)" stroke="#e48188" stroke-width="3"></polygon>
            <g id="compare-modal-current-dots" fill="#e48188"></g>
          </svg>
        </article>
      </div>
      <p class="compare-modal-comment" id="compare-modal-comment">比較データを読み込んでいます。</p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/fragrance-master-data.js"></script>
  <script src="../assets/js/public-data.js"></script>
  <script src="../assets/js/rebuild-customer-flow.js"></script>
</body>
</html>
