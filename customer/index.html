<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会員トップ | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
  <link rel="stylesheet" href="../css/customer/customer-index.css">
</head>
<body data-page="customer-portal">
  <header class="site-header">
    <div class="site-header-inner site-container">
      <a class="brand" href="../index.html"><span class="brand-logo-mark"><img src="../img/costomer/吟ロゴ.png" alt=""></span><span>Fragrance Workshop</span></a>
      <nav class="main-nav is-static customer-portal-nav"><button class="customer-portal-logout" id="logout-button" type="button" aria-label="ログアウト"><span aria-hidden="true">↪</span>ログアウト</button></nav>
    </div>
  </header>
  <main class="customer-portal-main">
    <section class="customer-portal-hero site-container">
      <div class="customer-portal-heading">
        <span class="customer-portal-heading-mark" aria-hidden="true"><img src="../img/costomer/会員ページの記号.png" alt=""></span>
        <h1>マイページ</h1>
        <div class="customer-portal-heading-copy">
          <p class="customer-portal-greeting"><span id="member-name-inline">会員</span>さん、こんにちは</p>
          <p class="customer-portal-copy">これまでの香りや次回の予約を確認できます。</p>
        </div>
      </div>
    </section>
    <p class="status-note" id="portal-status" hidden></p>
    <a class="btn secondary customer-portal-login-link" id="login-link" href="customer-login.html" hidden>ログインへ</a>
    <section class="customer-portal-dashboard site-container" aria-label="会員ページメニュー">
      <article class="customer-portal-card customer-portal-card--last">
        <div class="customer-portal-card-title">
          <span class="customer-portal-card-mark" aria-hidden="true"><img src="../img/costomer/会員ページの記号.png" alt=""></span>
          <h2>前回作成した香水</h2>
        </div>
        <div class="customer-last-fragrance">
          <img class="customer-last-fragrance-image" src="../img/costomer/台の上の瓶.png" alt="">
          <div class="customer-last-fragrance-detail">
            <h3 id="latest-product-name">未作成</h3>
            <dl class="customer-last-meta">
              <div class="customer-last-meta-row">
                <dt>
                  <span class="customer-last-meta-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false"><path d="M7 3v3M17 3v3M4.5 9h15M6 5h12a1.5 1.5 0 0 1 1.5 1.5v12A1.5 1.5 0 0 1 18 20H6a1.5 1.5 0 0 1-1.5-1.5v-12A1.5 1.5 0 0 1 6 5Z"></path></svg>
                  </span>
                  <span>来店日</span>
                </dt>
                <dd id="latest-product-date">-</dd>
              </div>
              <div class="customer-last-meta-row">
                <dt>
                  <span class="customer-last-meta-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
                  </span>
                  <span>スタッフ</span>
                </dt>
                <dd id="latest-product-staff">-</dd>
              </div>
              <div class="customer-last-meta-row">
                <dt>
                  <span class="customer-last-meta-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false"><path d="M5 4.5h14v15H5v-15ZM8 8h8M8 12h8M8 16h5"></path></svg>
                  </span>
                  <span>説明</span>
                </dt>
                <dd id="latest-product-summary">制作履歴が入ると、香りの傾向が表示されます。</dd>
              </div>
            </dl>
            <div class="customer-axis-preview" id="latest-axis-preview" aria-label="香り5軸" hidden></div>
          </div>
        </div>
        <a class="customer-portal-primary-action" href="reservation.html"><span aria-hidden="true">▣</span>もう一度この香りを予約する</a>
      </article>

      <article class="customer-portal-card customer-portal-card--new">
        <div class="customer-portal-card-title">
          <span class="customer-portal-card-mark" aria-hidden="true"><img src="../img/costomer/会員ページの記号.png" alt=""></span>
          <h2>新しく香りを作る</h2>
        </div>
        <p>今の気分に合わせて、もう一度アンケートから予約できます。</p>
        <img class="customer-new-fragrance-image" src="../img/costomer/アンケートと小瓶.png" alt="">
        <a class="customer-portal-secondary-action" href="questionnaire.html">アンケートに進む<span aria-hidden="true">›</span></a>
      </article>

      <article class="customer-portal-card customer-portal-card--history">
        <div class="customer-portal-card-title customer-portal-card-title--row">
          <span class="customer-portal-card-mark" aria-hidden="true"><img src="../img/costomer/会員ページの記号.png" alt=""></span>
          <h2>制作履歴</h2>
          <a href="#product-list">すべて見る<span aria-hidden="true">›</span></a>
        </div>
        <div class="customer-history-list record-list" id="product-list"></div>
      </article>
    </section>
    <section class="customer-portal-compare site-container">
      <a class="customer-compare-card" href="fragrance-graph.html">
        <span class="customer-compare-icon" aria-hidden="true"><img src="../img/costomer/会員ページbottomの記号.png" alt=""></span>
        <strong>前回と今回のアンケート結果を比較できます</strong>
        <span>比較ページを開く　›</span>
      </a>
    </section>
    <section class="customer-portal-hidden-records" hidden>
      <div class="record-list" id="reservation-list"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/public-data.js"></script>
  <script src="../js/customer-auth-page.js"></script>
</body>
</html>
