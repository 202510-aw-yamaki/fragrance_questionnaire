<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会員トップ | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
</head>
<body data-page="customer-portal">
  <header class="site-header">
    <div class="site-header-inner site-container">
      <a class="brand" href="../index.html"><span class="brand-mark">✦</span><span>Fragrance Workshop</span></a>
      <nav class="main-nav is-static"><a href="questionnaire.html">新しいアンケート</a><a href="reservation.html">予約</a><button class="admin-btn secondary" id="logout-button" type="button">ログアウト</button></nav>
    </div>
  </header>
  <main class="admin-main">
    <section class="admin-page-title">
      <div>
        <span class="eyebrow">Member Portal</span>
        <h1><span id="member-name-inline">会員</span>ページ</h1>
      </div>
      <a class="btn primary" href="questionnaire.html">アンケートへ</a>
    </section>
    <p class="status-note" id="portal-status" hidden></p>
    <a class="btn secondary" id="login-link" href="customer-login.html" hidden>ログインへ</a>
    <section class="grid-3">
      <article class="card"><p class="admin-note">お名前</p><strong id="member-name">-</strong></article>
      <article class="card"><p class="admin-note">メール</p><strong id="member-email">-</strong></article>
      <article class="card"><p class="admin-note">会員番号</p><strong id="member-code">-</strong></article>
    </section>
    <section class="section">
      <div class="grid-2">
        <article>
          <h2 class="section-title">制作履歴</h2>
          <div class="record-list" id="product-list"></div>
        </article>
        <article>
          <h2 class="section-title">予約履歴</h2>
          <div class="record-list" id="reservation-list"></div>
        </article>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/public-data.js"></script>
  <script src="../js/customer-auth-page.js"></script>
</body>
</html>
