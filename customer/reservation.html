<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>来店予約 | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
</head>
<body data-page="reservation">
  <header class="site-header">
    <div class="site-header-inner site-container">
      <a class="brand" href="../index.html"><span class="brand-mark">✦</span><span>Fragrance Workshop</span></a>
      <nav class="main-nav is-static"><a href="questionnaire.html">アンケート</a><a href="fragrance-graph.html">結果</a></nav>
    </div>
  </header>
  <main class="admin-main">
    <section class="admin-page-title">
      <div><span class="eyebrow">Reservation</span><h1>ワークショップ予約</h1><p id="summary-body" class="page-copy"></p></div>
    </section>
    <section class="grid-2">
      <article class="card">
        <h2 id="summary-headline">香りの準備ができました</h2>
        <div id="axis-list" class="action-row"></div>
        <p class="status-note" id="selected-status">日時を選択してください。</p>
        <div id="slot-list" class="form-stack"></div>
      </article>
      <article class="card">
        <div class="form-stack">
          <label class="field">来店種別<select id="visit-type"><option value="first">初回来店</option><option value="return">再来店</option><option value="gift">ギフト相談</option></select></label>
          <label class="field">人数<select id="guest-count"><option value="1">1名</option><option value="2">2名</option><option value="3">3名</option><option value="4">4名</option></select></label>
          <label class="field">スタッフへのメモ<textarea id="staff-memo" rows="5"></textarea></label>
          <button class="btn primary" id="confirm-btn" type="button">この内容で予約する</button>
        </div>
      </article>
    </section>
  </main>
  <div class="portal-modal slot-modal" id="slot-modal" hidden data-density="compact">
    <div class="portal-modal-backdrop"></div>
    <div class="portal-modal-dialog" id="slot-modal-card">
      <h2 id="slot-modal-title">予約枠</h2>
      <p id="slot-modal-copy" class="admin-note"></p>
      <div id="slot-modal-panels"></div>
      <button class="btn secondary" id="slot-close" type="button">閉じる</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/public-data.js"></script>
  <script src="../js/rebuild-customer-flow.js"></script>
</body>
</html>
