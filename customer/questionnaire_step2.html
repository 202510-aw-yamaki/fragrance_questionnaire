<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>香りの追加アンケート | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
</head>
<body data-page="questionnaire-step2">
  <header class="site-header">
    <div class="site-header-inner site-container">
      <a class="brand" id="brand-link" href="../index.html"><span class="brand-mark">✦</span><span>Fragrance Workshop</span></a>
      <div class="progress-card"><strong id="question-index">1 / 3</strong><div class="progress-track"><span class="progress-fill" id="progress-bar"></span></div><div id="question-stepper"></div></div>
    </div>
  </header>
  <main class="page-hero">
    <div class="page-shell">
      <h1>香りをもう少し絞り込む</h1>
      <p class="page-copy" id="helper-text">前半の回答から、仕上がりの方向性を調整します。</p>
      <p class="pill" id="step2-status"></p>
      <div class="question-layout">
        <section class="question-card">
          <p class="eyebrow" id="progress-label">1 / 3</p>
          <h2 id="question-title"></h2>
          <p class="admin-note" id="question-caption"></p>
          <div class="option-grid" id="option-list"></div>
          <div id="sub-options"></div>
          <div class="question-footer">
            <button class="btn secondary" id="header-prev-btn" type="button">戻る</button>
            <button class="btn primary" id="header-next-btn" type="button">結果へ</button>
          </div>
        </section>
        <aside class="page-hero-aside"><h2 id="note-title">現在の5軸</h2><div id="axis-preview"></div></aside>
      </div>
      <button class="btn secondary" id="return-top-btn" type="button">トップへ戻る</button>
      <button class="btn secondary" id="return-top-btn-mobile" type="button">トップへ戻る</button>
    </div>
  </main>
  <div class="portal-modal" id="questionnaire-sync-modal" hidden>
    <div class="portal-modal-backdrop"></div>
    <div class="portal-modal-dialog">
      <h2 id="questionnaire-sync-title">保存確認</h2>
      <p class="status-note" id="questionnaire-sync-status"></p>
      <div class="admin-actions">
        <button class="admin-btn secondary" id="questionnaire-sync-retry" type="button">再試行</button>
        <button class="admin-btn primary" id="questionnaire-sync-continue" type="button">結果へ進む</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/fragrance-master-data.js"></script>
  <script src="../js/public-data.js"></script>
  <script src="../js/rebuild-customer-flow.js"></script>
</body>
</html>
