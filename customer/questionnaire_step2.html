<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>香りの追加アンケート | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
  <link rel="stylesheet" href="../css/customer/customer-questionnaire-step2.css">
</head>
<body data-page="questionnaire-step2">
  <header class="site-header">
    <div class="site-header-inner site-container">
      <a class="brand" id="brand-link" href="../index.html"><span class="brand-logo-mark"><img src="../img/costomer/吟ロゴ.png" alt=""></span><span>Fragrance Workshop</span></a>
      <div class="progress-card questionnaire-step2-progress-card">
        <span class="questionnaire-step2-progress-mark" aria-hidden="true"></span>
        <strong id="question-index">6 / 8</strong>
        <div class="progress-track"><span class="progress-fill" id="progress-bar"></span></div>
        <div id="question-stepper"></div>
      </div>
    </div>
  </header>
  <main class="page-hero questionnaire-step2-main">
    <div class="page-shell questionnaire-step2-shell">
      <div class="questionnaire-step2-hero">
        <div class="questionnaire-step2-heading">
          <h1 id="question-title"></h1>
          <p class="page-copy" id="helper-text" hidden></p>
        </div>
      </div>
      <div class="question-layout questionnaire-step2-layout">
        <section class="question-card">
          <p class="eyebrow" id="progress-label">6 / 8</p>
          <span class="question-card-divider" aria-hidden="true"></span>
          <p class="admin-note" id="question-caption"></p>
          <div class="option-grid" id="option-list"></div>
          <div id="sub-options"></div>
          <div class="questionnaire-step2-tendency">
            <p class="pill" id="step2-status"></p>
            <span class="questionnaire-step2-tendency-bars" aria-hidden="true"></span>
          </div>
          <div class="question-footer">
            <button class="btn primary" id="header-next-btn" type="button">結果へ</button>
          </div>
        </section>
        <aside class="page-hero-aside questionnaire-step2-aside">
          <h2 id="note-title">香りを一緒にチューニング</h2>
          <p class="admin-note" id="note-body">回答は香り5軸とおすすめの方向性に反映されます。</p>
          <div id="axis-preview"></div>
        </aside>
      </div>
      <button class="btn secondary" id="return-top-btn" type="button">トップへ戻る</button>
      <button class="btn secondary" id="return-top-btn-mobile" type="button">トップへ戻る</button>
    </div>
  </main>
  <div class="portal-modal" id="questionnaire-sync-modal" hidden>
    <div class="portal-modal-backdrop"></div>
    <div class="portal-modal-dialog">
      <h2 id="questionnaire-sync-title">保存確認</h2>
      <p class="status-note" id="questionnaire-sync-status"></p>
      <div class="admin-actions">
        <button class="admin-btn secondary" id="questionnaire-sync-retry" type="button">再試行</button>
        <button class="admin-btn primary" id="questionnaire-sync-continue" type="button">結果へ進む</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/fragrance-master-data.js"></script>
  <script src="../js/public-data.js"></script>
  <script src="../js/rebuild-customer-flow.js"></script>
</body>
</html>
