<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>香りバランス | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
</head>
<body data-page="graph">
  <header class="site-header">
    <div class="site-header-inner site-container">
      <a class="brand" id="brand-link" href="../index.html"><span class="brand-mark">✦</span><span>Fragrance Workshop</span></a>
      <nav class="main-nav is-static"><a href="questionnaire.html">再回答</a><a href="reservation.html">予約</a></nav>
    </div>
  </header>
  <main class="admin-main">
    <section class="admin-page-title">
      <div><span class="eyebrow">Fragrance Balance</span><h1>香り5軸の結果</h1></div>
      <a class="btn primary" id="reserve-link" href="reservation.html">この内容で予約へ進む</a>
    </section>
    <section id="graph-adjustment" class="grid-2">
      <article class="card">
        <svg id="radar-graph" class="radar-graph" viewBox="0 0 360 360" role="img" aria-label="5軸グラフ">
          <g id="grid-polygons" fill="none" stroke="#d9cec1"></g>
          <g id="axis-lines" stroke="#d9cec1"></g>
          <g id="axis-labels" fill="#6f665f" font-size="13" text-anchor="middle"></g>
          <polygon id="radar-shape" fill="rgba(220,119,119,.24)" stroke="#d77777" stroke-width="3"></polygon>
          <g id="vertex-dots" fill="#d77777"></g>
        </svg>
      </article>
      <article class="card">
        <h2 id="adjust-heading">気になる項目だけ微調整</h2>
        <div id="slider-list" class="slider-list"></div>
        <div class="action-row">
          <button class="ghost-btn" type="button" id="reset-btn">初期値</button>
          <button class="ghost-btn" type="button" data-preset="A">軽やか</button>
          <button class="ghost-btn" type="button" data-preset="B">やわらか</button>
          <button class="ghost-btn" type="button" data-preset="C">印象強め</button>
        </div>
      </article>
    </section>
    <section id="cta" class="section"><div class="card"><div id="summary-list"></div><a class="btn primary" href="reservation.html">予約へ進む</a></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/fragrance-master-data.js"></script>
  <script src="../js/public-data.js"></script>
  <script src="../js/rebuild-customer-flow.js"></script>
</body>
</html>
