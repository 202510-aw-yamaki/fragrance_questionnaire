<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR商品作成依頼 | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
</head>
<body data-page="product-reservation">
  <header class="site-header">
    <div class="site-header-inner site-container"><a class="brand" href="../index.html"><span class="brand-mark">✦</span><span>Fragrance Workshop</span></a></div>
  </header>
  <main class="page-hero">
    <div class="page-shell page-hero-inner">
      <article class="request-card" aria-labelledby="product-name">
        <span class="eyebrow">QR Request</span>
        <h1 id="product-name">読み込み中</h1>
        <div class="grid-2">
          <p class="portal-card">10ml <strong id="price-10ml">-</strong></p>
          <p class="portal-card">30ml <strong id="price-30ml">-</strong></p>
        </div>
        <form id="qr-request-form" class="form-stack" novalidate>
          <label class="qr-field">10ml 数量
            <span class="quantity-control"><button type="button" data-quantity-target="quantity-10ml" data-step="-1">-</button><input id="quantity-10ml" name="quantity_10ml" type="number" min="0" step="1" inputmode="numeric" value="0"><button type="button" data-quantity-target="quantity-10ml" data-step="1">+</button></span>
          </label>
          <label class="qr-field">30ml 数量
            <span class="quantity-control"><button type="button" data-quantity-target="quantity-30ml" data-step="-1">-</button><input id="quantity-30ml" name="quantity_30ml" type="number" min="0" step="1" inputmode="numeric" value="0"><button type="button" data-quantity-target="quantity-30ml" data-step="1">+</button></span>
          </label>
          <div class="portal-card"><p id="request-summary"></p><strong id="request-total">-</strong></div>
          <label class="qr-field">メールアドレス<input id="requester-email" name="requester_email" type="email" autocomplete="email" required></label>
          <p class="status-note" id="request-status" aria-live="polite"></p>
          <button class="main-button" id="submit-request" type="submit" disabled>この香水を作成依頼する</button>
        </form>
      </article>
      <aside class="page-hero-aside">
        <h2>受付後の流れ</h2>
        <ol class="step-list">
          <li class="step-item"><span class="step-number">1</span><span>作成依頼を送信</span></li>
          <li class="step-item"><span class="step-number">2</span><span>店舗で作成可否を確認</span></li>
          <li class="step-item"><span class="step-number">3</span><span>メールで連絡</span></li>
        </ol>
        <p class="admin-note">電話: <span id="shop-phone">-</span></p>
        <p class="admin-note">受付時間: <span id="business-hours">-</span></p>
      </aside>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/public-data.js"></script>
  <script src="../js/product-reservation-page.js"></script>
</body>
</html>
