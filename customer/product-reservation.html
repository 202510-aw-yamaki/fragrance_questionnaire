<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR商品作成依頼 | Fragrance Workshop</title>
  <meta name="description" content="QRコードから香水の作成依頼を送信するページです。">
  <style>
    :root {
      --bg: #fbf5ef;
      --panel: rgba(255, 253, 249, 0.94);
      --text: #342923;
      --muted: #7c6d64;
      --line: #e7d4c4;
      --accent: #cf7785;
      --accent-dark: #a54f5f;
      --gold: #c7a15a;
      --shadow: 0 24px 60px rgba(84, 58, 42, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 360px;
      min-height: 100vh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      line-height: 1.7;
      background:
        linear-gradient(90deg, rgba(251, 245, 239, 0.86), rgba(255, 250, 246, 0.74)),
        url("../img/TOP/香水対比.png") center / cover fixed;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled,
    input:disabled {
      cursor: not-allowed;
      opacity: 0.56;
    }

    .page-shell {
      width: min(100% - 32px, 1200px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 0 28px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      min-height: 56px;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .brand-link img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .header-link {
      min-height: 42px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(111, 85, 66, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.76);
      text-decoration: none;
      color: #5a4638;
      font-weight: 700;
    }

    .request-stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 500px) minmax(0, 1fr);
      align-items: center;
      gap: 28px;
    }

    .side-visual {
      min-height: 560px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.08);
    }

    .request-card {
      position: relative;
      width: 100%;
      border: 1px solid rgba(188, 148, 83, 0.74);
      border-radius: 28px;
      padding: 26px 22px 22px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .request-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(201, 163, 91, 0.42);
      border-radius: 22px;
      pointer-events: none;
    }

    .request-content {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 16px;
    }

    .page-title {
      text-align: center;
      display: grid;
      gap: 6px;
    }

    .page-title span {
      color: #a47b3b;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .page-title h1 {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(2.45rem, 1.8rem + 2.6vw, 4rem);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: 0.04em;
    }

    .section-heading {
      margin: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      color: var(--accent);
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.08em;
    }

    .section-heading::before,
    .section-heading::after {
      content: "";
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .section-heading::after {
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .price-list,
    .quantity-list {
      display: grid;
      gap: 10px;
    }

    .price-row,
    .quantity-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 46px;
    }

    .price-row {
      padding: 0 16px;
      border: 1px solid rgba(194, 160, 105, 0.46);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.74);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .price-row strong {
      font-size: 1rem;
      font-weight: 700;
    }

    .quantity-row label {
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .quantity-control {
      width: min(100%, 184px);
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 42px;
      align-items: center;
      border: 1px solid rgba(110, 87, 70, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      overflow: hidden;
    }

    .quantity-control button {
      width: 42px;
      height: 38px;
      border: 0;
      background: transparent;
      color: #8f7c6f;
      font-size: 1.3rem;
      line-height: 1;
    }

    .quantity-control input {
      width: 100%;
      min-width: 0;
      height: 38px;
      border: 0;
      border-inline: 1px solid rgba(110, 87, 70, 0.12);
      background: transparent;
      color: var(--accent-dark);
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      appearance: textfield;
    }

    .quantity-control input::-webkit-outer-spin-button,
    .quantity-control input::-webkit-inner-spin-button {
      appearance: none;
      margin: 0;
    }

    .summary-box {
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px solid rgba(188, 148, 83, 0.7);
      border-radius: 18px;
      background: rgba(255, 252, 248, 0.9);
      box-shadow: 0 10px 22px rgba(122, 86, 54, 0.12);
      text-align: center;
    }

    .summary-box h2 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 1rem;
      letter-spacing: 0.1em;
    }

    .summary-lines {
      display: grid;
      gap: 2px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 1.12rem;
      line-height: 1.55;
    }

    .summary-total {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dotted rgba(170, 113, 83, 0.56);
      color: var(--accent);
      font-size: 1.35rem;
      font-weight: 800;
    }

    .field {
      margin-top: 14px;
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .field input {
      width: 100%;
      min-height: 48px;
      border: 1px solid rgba(110, 87, 70, 0.24);
      border-radius: 9px;
      padding: 0 14px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--text);
    }

    .main-button {
      width: 100%;
      min-height: 58px;
      margin-top: 10px;
      border: 1px solid rgba(177, 90, 106, 0.5);
      border-radius: 14px;
      background: linear-gradient(180deg, #eaa0ad, #cf7785 48%, #bd6474);
      color: #fffdfb;
      box-shadow: 0 12px 20px rgba(154, 64, 78, 0.24);
      font-size: clamp(1.1rem, 0.98rem + 0.55vw, 1.55rem);
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .button-note {
      margin: 6px 0 0;
      color: #5f554f;
      font-size: 0.82rem;
      text-align: center;
    }

    .notice {
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 249, 239, 0.9);
      border: 1px solid rgba(194, 160, 105, 0.38);
      color: #5f554f;
      font-size: 0.92rem;
    }

    .notice.strong {
      border-color: rgba(207, 119, 133, 0.38);
      background: rgba(255, 246, 247, 0.92);
    }

    .status-message {
      min-height: 24px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
    }

    .status-message[data-tone="error"] {
      color: #a64545;
    }

    .status-message[data-tone="success"] {
      color: #417452;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 980px) {
      body {
        background-attachment: scroll;
      }

      .request-stage {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      .side-visual {
        display: none;
      }

      .request-card {
        max-width: 520px;
      }
    }

    @media (max-width: 560px) {
      .page-shell {
        width: min(100% - 20px, 1200px);
        padding-top: 12px;
      }

      .site-header {
        align-items: flex-start;
      }

      .brand-link span {
        display: none;
      }

      .request-card {
        border-radius: 22px;
        padding: 22px 14px 16px;
      }

      .request-card::before {
        inset: 7px;
        border-radius: 18px;
      }

      .price-row,
      .quantity-row {
        grid-template-columns: 1fr;
        justify-items: stretch;
      }

      .quantity-control {
        width: 100%;
      }
    }
  </style>
  <link rel="stylesheet" href="../css/qr-product-page.css">
</head>
<body class="qr-product-page">
  <div class="page-shell">
    <header class="site-header">
      <a class="brand-link" href="../index.html" aria-label="Fragrance Workshop">
        <img src="../img/TOP/吟ロゴ.png" alt="">
        <span>Fragrance Workshop</span>
      </a>
      <a class="header-link" href="../index.html">トップへ戻る</a>
    </header>

    <main class="request-stage">
      <div class="side-visual" aria-hidden="true"></div>

      <article class="request-card" aria-labelledby="product-name">
        <div class="request-content">
          <div class="page-title">
            <span>QR商品ページ</span>
            <h1 id="product-name">読み込み中</h1>
          </div>

          <p class="section-heading">容量を選択してください</p>

          <div class="price-list" aria-label="価格">
            <div class="price-row">
              <span>10ml</span>
              <strong id="price-10ml">-</strong>
            </div>
            <div class="price-row">
              <span>30ml</span>
              <strong id="price-30ml">-</strong>
            </div>
          </div>

          <form id="qr-request-form" novalidate>
            <div class="quantity-list">
              <div class="quantity-row">
                <label for="quantity-10ml">10ml 数量</label>
                <div class="quantity-control">
                  <button type="button" data-quantity-target="quantity-10ml" data-step="-1" aria-label="10mlを減らす">−</button>
                  <input id="quantity-10ml" name="quantity_10ml" type="number" min="0" step="1" inputmode="numeric" value="0">
                  <button type="button" data-quantity-target="quantity-10ml" data-step="1" aria-label="10mlを増やす">＋</button>
                </div>
              </div>

              <div class="quantity-row">
                <label for="quantity-30ml">30ml 数量</label>
                <div class="quantity-control">
                  <button type="button" data-quantity-target="quantity-30ml" data-step="-1" aria-label="30mlを減らす">−</button>
                  <input id="quantity-30ml" name="quantity_30ml" type="number" min="0" step="1" inputmode="numeric" value="0">
                  <button type="button" data-quantity-target="quantity-30ml" data-step="1" aria-label="30mlを増やす">＋</button>
                </div>
              </div>
            </div>

            <section class="summary-box" aria-live="polite" aria-label="依頼内容">
              <h2>ご依頼内容</h2>
              <div class="summary-lines" id="request-summary"></div>
              <div class="summary-total" id="request-total">商品合計：0円（税込）</div>
            </section>

            <div class="field">
              <label for="requester-email">メールアドレス</label>
              <input id="requester-email" name="requester_email" type="email" autocomplete="email" placeholder="yourname@example.com" required>
            </div>

            <p class="status-message" id="request-status" role="status"></p>

            <button class="main-button" id="submit-request" type="submit" disabled>この香水を作成依頼する</button>
            <p class="button-note">※このボタンを押すと、原材料在庫の確認後、メールをさせていただきます。</p>
          </form>

          <div class="notice">
            送料・着払い手数料は別途かかります。発送元は東京を想定しています。正式な送料等は、作成可能のご案内後に確認させていただきます。
          </div>

          <div class="notice strong">
            <p>まとまった本数をご希望の場合は、原材料の確認が必要となります。恐れ入りますが、営業時間内に店舗までお電話にてご相談ください。</p>
            <div class="contact-lines">
              <span>店舗電話番号：<b id="shop-phone">03-1234-5678</b></span>
              <span>受付時間：<b id="business-hours">11:00〜19:00</b></span>
            </div>
          </div>
        </div>
      </article>

      <div class="side-visual" aria-hidden="true"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/public-data.js"></script>
  <script src="../js/product-reservation-page.js"></script>
</body>
</html>
