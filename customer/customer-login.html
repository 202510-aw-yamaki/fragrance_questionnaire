<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会員ログイン | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
</head>
<body data-page="customer-login">
  <header class="site-header">
    <div class="site-header-inner site-container">
      <a class="brand" href="../index.html"><span class="brand-mark">✦</span><span>Fragrance Workshop</span></a>
      <nav class="main-nav is-static"><a href="../index.html">トップ</a><a href="questionnaire.html">アンケート</a><a href="reservation.html">予約</a></nav>
    </div>
  </header>
  <main class="page-hero">
    <div class="page-shell page-hero-inner">
      <section>
        <span class="eyebrow" id="entrance-label">Customer Entrance</span>
        <h1 id="customer-title">会員ページで香りの履歴を確認する</h1>
        <p class="page-copy">制作した香りや予約履歴を確認できます。</p>
      </section>
      <section class="login-panel">
        <h2 id="login-title">メールアドレスでログイン</h2>
        <form class="login-form" id="customer-login-form">
          <label>メールアドレス<input type="email" name="email" autocomplete="email" required></label>
          <label>パスワード<input type="password" name="password" autocomplete="current-password" required></label>
          <div class="action-row">
            <button class="btn primary" type="submit">ログイン</button>
            <button class="btn secondary" type="button" id="setup-button">初回ログイン・パスワード設定</button>
          </div>
          <p class="status-note" id="login-status" aria-live="polite" hidden></p>
        </form>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/public-data.js"></script>
  <script src="../js/customer-auth-page.js"></script>
</body>
</html>
