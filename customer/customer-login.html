<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会員ログイン | Fragrance Workshop</title>
  <link rel="stylesheet" href="../assets/css/rebuild-ui.css">
  <link rel="stylesheet" href="../assets/css/customer/customer-login.css">
</head>
<body id="customer-login-top" data-page="customer-login">
  <header class="site-header">
    <div class="site-header-inner site-container">
      <a class="brand" href="../index.html"><span class="brand-logo-mark"><img src="../assets/img/customer/吟ロゴ.png" alt=""></span><span>Fragrance Workshop</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="customer-login-menu" aria-label="メニュー">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav is-static customer-login-nav" id="customer-login-menu">
        <a href="../index.html"><span class="desktop-label">トップページへ戻る</span><span class="mobile-label">トップへ</span></a>
        <a class="customer-login-menu-page-top" href="#customer-login-top">上へ戻る</a>
        <a class="customer-login-menu-benefits" href="#customer-login-benefits">できること</a>
      </nav>
    </div>
  </header>
  <main class="customer-login-main">
    <div class="customer-login-shell">
      <section class="login-panel customer-login-card" aria-labelledby="login-title">
        <div class="customer-login-heading">
          <span class="customer-login-ornament" aria-hidden="true"></span>
          <h1 id="login-title">会員ログイン</h1>
        </div>
        <form class="login-form" id="customer-login-form">
          <label>メールアドレス<input type="email" name="email" autocomplete="email" placeholder="member@example.com" required></label>
          <label class="customer-login-save"><span>入力を保存する</span><input type="checkbox" id="save-email-checkbox"></label>
          <label>パスワード
            <span class="customer-password-field">
              <input type="password" name="password" id="customer-password-input" autocomplete="current-password" placeholder="パスワードを入力" required>
              <button class="customer-password-toggle" type="button" id="password-toggle-button" aria-label="パスワードを表示" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.8 12s3.4-6 9.2-6 9.2 6 9.2 6-3.4 6-9.2 6-9.2-6-9.2-6Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </span>
          </label>
          <button class="btn primary customer-login-submit" type="submit">ログイン</button>
          <div class="customer-login-links">
            <button class="customer-login-text-button" type="button" id="setup-button">初回ログイン・パスワード設定</button>
            <p class="customer-login-setup-note">ワークショップ当日に登録したメールアドレスから初回ログイン設定を行えます。</p>
          </div>
          <p class="status-note" id="login-status" aria-live="polite" hidden></p>
        </form>
      </section>
      <section class="customer-login-benefits" id="customer-login-benefits" aria-labelledby="benefits-title">
        <h2 id="benefits-title">会員ページでできること</h2>
        <div class="customer-benefit-grid">
          <article class="customer-benefit-card">
            <img src="../assets/img/customer/customer_seisaku.png" alt="">
            <h3>制作履歴を見る</h3>
          </article>
          <article class="customer-benefit-card">
            <img src="../assets/img/customer/customer_kako.png" alt="">
            <h3>過去の香水を再予約</h3>
          </article>
          <article class="customer-benefit-card">
            <img src="../assets/img/customer/customer_saido.png" alt="">
            <h3>再度アンケートから</h3>
          </article>
          <article class="customer-benefit-card">
            <img src="../assets/img/customer/customer_zenkai.png" alt="">
            <h3>前回の香りと比較</h3>
          </article>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/public-data.js"></script>
  <script src="../assets/js/customer-auth-page.js"></script>
</body>
</html>
