<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fragrance Workshop STEP1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* css/common.css */
* {
  box-sizing: border-box;
}

.site-container {
  width: var(--container);
  margin: 0 auto;
}

.page-canvas {
  margin: 0;
  min-width: 360px;
  min-height: 100vh;
  color: var(--text);
  line-height: 1.7;
  letter-spacing: 0.02em;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  backdrop-filter: blur(14px);
  background: rgba(252, 248, 243, 0.82);
  border-bottom: 1px solid rgba(230, 221, 210, 0.88);
}

.page-header-inner {
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
  font-weight: 800;
  letter-spacing: 0.05em;
  white-space: nowrap;
  color: inherit;
}

.brand picture {
  display: block;
}

.brand img {
  width: auto;
  height: auto;
  max-height: 48px;
  max-width: 100%;
}

.header-inner {
  color: var(--text);
}

.header-cta {
  width: auto;
  flex: 0 0 auto;
  white-space: nowrap;
}

@media (max-width: 47.9375em) {
  .page-header-inner {
    min-height: auto;
    padding: 10px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
  }

  .header-top {
    flex: 0 0 auto;
    min-width: 0;
  }

  .brand {
    font-size: .95rem;
    min-width: 0;
  }

  .page-header-inner > .main-nav {
    width: 100%;
  }

  .page-header-inner > .header-actions {
    width: auto;
    min-width: 0;
    margin-left: auto;
  }

  .page-header-inner > .header-cta {
    width: 100%;
  }
}

.page-body {
  display: grid;
  gap: 14px;
}

.page-body > * {
  min-width: 0;
}

.page-main,
.page-panel,
.page-section-inner {
  min-width: 0;
}

.page-panel {
  display: block;
  min-height: 0;
}

.page-section {
  display: block;
  min-width: 0;
}

.section-header {
  display: grid;
  gap: 8px;
}

.section-header h1,
.section-header h2 {
  margin: 0;
  line-height: 1.2;
}

.section-header p {
  margin: 0;
  color: var(--muted);
}

.overline {
  display: block;
  color: var(--muted);
  font-size: 0.82rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.eyebrow,
.section-label {
  display: inline-flex;
  align-items: center;
  justify-self: start;
  min-height: 32px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.eyebrow {
  background: rgba(200, 137, 114, 0.14);
  color: var(--accent-deep);
}

.section-label {
  color: #9b7364;
}

.glass-panel {
  border: 1px solid rgba(201, 174, 155, 0.65);
  background: var(--panel);
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
  border-radius: var(--radius-lg);
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 999px;
  background: #f6eee8;
  color: #855644;
  font-size: 14px;
  font-weight: 700;
}

.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1px solid transparent;
  text-decoration: none;
  font-weight: 700;
  cursor: pointer;
  font: inherit;
  transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}

.btn:hover,
.btn:focus-visible {
  transform: translateY(-1px);
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #dfb8a6);
  border-color: #c58975;
  color: #fffdfb;
  box-shadow: 0 12px 24px rgba(130, 83, 53, 0.16);
}

.btn-secondary {
  border-color: var(--line);
  background: rgba(255, 255, 255, 0.84);
  color: var(--text);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

    /* css/questionnaire-common.css */
.main-nav ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  gap: 14px;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: nowrap;
}

.main-nav button {
  min-height: 40px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255, 251, 246, 0.92);
  color: var(--muted);
  cursor: pointer;
  transition: border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
}

.main-nav button:hover,
.main-nav button:focus-visible {
  color: var(--text);
  border-color: rgba(190, 154, 132, 0.95);
  transform: translateY(-1px);
}

.main-nav button[disabled] {
  opacity: 0.45;
  cursor: default;
  pointer-events: none;
  transform: none;
}

.nav-icon {
  display: none;
  font-family: "Material Icons";
  font-size: 20px;
  line-height: 1;
  font-style: normal;
  font-weight: normal;
  letter-spacing: normal;
  text-transform: none;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-smoothing: antialiased;
  -webkit-font-feature-settings: "liga";
  font-feature-settings: "liga";
}

.step-strip,
.question-shell {
  border: 1px solid rgba(201, 174, 155, 0.65);
  background: var(--panel);
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}

.step-strip {
  border-radius: 20px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.step-group {
  display: flex;
  gap: 10px;
  align-items: center;
}

.step-badge {
  min-width: 114px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.step-badge.current {
  background: linear-gradient(135deg, #f3dfd5, #fbf1ea);
  color: #855543;
  border-color: #d6aa99;
}

.step-badge.next {
  background: linear-gradient(135deg, #e3ece1, #f4f8f1);
  color: #597059;
}

.step-copy {
  text-align: right;
  display: grid;
  gap: 4px;
}

.step-copy strong {
  font-size: 14px;
  color: #8b5f4d;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.step-copy span {
  font-size: 14px;
  color: var(--muted);
}

.question-shell {
  border-radius: 28px;
  padding: 18px;
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr) 320px;
  gap: 18px;
  min-height: 0;
}

.question-shell>* {
  min-width: 0;
}

.panel {
  min-height: 0;
  border-radius: 24px;
  background: rgba(255, 250, 245, 0.96);
  border: 1px solid rgba(220, 206, 194, 0.82);
}

.nav-panel {
  padding: 18px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 14px;
  background: linear-gradient(180deg, rgba(246, 238, 231, 0.98), rgba(250, 246, 241, 0.96));
}

.nav-title {
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #9b7364;
}

.nav-list {
  display: grid;
  gap: 10px;
}

.nav-item {
  width: 100%;
  padding: 14px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: #f8f3ee;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
}

.nav-item:hover {
  transform: translateX(3px);
}

.nav-item.active {
  border-color: #ca9d8c;
  background: linear-gradient(135deg, #f7e7de, #fffaf7);
  box-shadow: 0 12px 28px rgba(177, 136, 115, 0.14);
}

.nav-item.done {
  background: linear-gradient(135deg, #e7efe6, #f8fbf7);
  border-color: #bfd0bd;
}

.nav-item .no {
  display: block;
  font-size: 12px;
  color: #8b786d;
  margin-bottom: 4px;
}

.nav-item .label {
  display: block;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.35;
}

.nav-note {
  margin-top: auto;
  padding: 14px;
  border-radius: 18px;
  background: #f4ebe2;
  color: #6d584b;
  font-size: 13px;
  line-height: 1.65;
}

.main-panel {
  padding: 22px;
  display: grid;
  grid-template-rows: auto auto auto minmax(0, 1fr) auto;
  gap: 16px;
}

.question-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.question-index {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 999px;
  background: #f6eee8;
  color: #855644;
  font-size: 14px;
  font-weight: 700;
}

.helper-text {
  font-size: 14px;
  color: var(--muted);
}

.progress-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}

.progress-track {
  height: 10px;
  border-radius: 999px;
  background: #eadfd6;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 20%;
  border-radius: 999px;
  background: linear-gradient(90deg, #c98f77, #d6a996);
  transition: width 0.22s ease;
}

.progress-label {
  font-size: 14px;
  color: #7f695d;
  white-space: nowrap;
}

.question-title {
  margin: 0;
  font-size: clamp(28px, 3vw, 48px);
  line-height: 1.2;
  letter-spacing: -0.03em;
}

.question-caption {
  margin: 0;
  font-size: 15px;
  color: var(--muted);
  line-height: 1.75;
}

.option-list {
  display: grid;
  gap: 12px;
  align-content: start;
}

.option-card {
  width: 100%;
  min-height: 122px;
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 18px;
  display: flex;
  align-items: center;
  text-align: left;
  cursor: pointer;
  background-color: #fffdfa;
  background-size: cover;
  background-position: center;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  overflow: hidden;
  position: relative;
  isolation: isolate;
}

.option-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(255, 251, 246, 0.94) 0%, rgba(255, 251, 246, 0.88) 36%, rgba(255, 251, 246, 0.72) 62%, rgba(255, 251, 246, 0.58) 100%);
  z-index: 0;
}

.option-card-image-right {
  background-position: right center;
  background-size: auto 100%;
  background-repeat: no-repeat;
}

.option-card-image-right::before {
  display: none;
}

.option-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 32px rgba(105, 84, 70, 0.1);
}

.option-card.selected {
  border-color: #c58975;
  box-shadow: 0 18px 36px rgba(178, 130, 104, 0.18);
}

.option-copy {
  display: grid;
  gap: 8px;
  position: relative;
  z-index: 1;
  max-width: min(72%, 520px);
}

.option-label {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #906654;
  text-transform: uppercase;
}

.option-title {
  font-size: clamp(18px, 1.8vw, 28px);
  font-weight: 700;
  line-height: 1.35;
}

.option-desc {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.7;
}

.sub-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.sub-option {
  width: 100%;
  min-height: 62px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: #f8f3ee;
  color: #5d4c42;
  cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease;
}

.sub-option.selected {
  border-color: #c58975;
  background: #f3e2d9;
}

.side-panel {
  padding: 18px;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto auto;
  gap: 14px;
  background: linear-gradient(180deg, rgba(250, 245, 239, 0.98), rgba(244, 239, 232, 0.98));
}

.store-visual {
  min-height: 260px;
  border-radius: 28px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  color: #fffaf6;
  background:
    linear-gradient(180deg, rgba(37, 45, 53, 0.14), rgba(56, 37, 20, 0.38)),
    url("https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=1400&q=80")
      center / cover;
  box-shadow: inset 0 -72px 110px rgba(34, 22, 15, 0.28);
}

.store-visual strong {
  font-size: 24px;
  letter-spacing: 0.06em;
}

.store-visual span {
  margin-top: 8px;
  max-width: 20em;
  font-size: 14px;
  line-height: 1.7;
}

.side-card,
.return-card {
  border-radius: 22px;
  padding: 16px;
  background: #fffaf6;
  border: 1px solid rgba(216, 203, 192, 0.95);
  min-width: 0;
}

.side-card {
  background: linear-gradient(180deg, #e4eee2, #f0f5ec);
  border-color: rgba(191, 202, 188, 0.9);
}

.side-card strong,
.return-card strong {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  letter-spacing: 0.06em;
}

.side-card strong {
  color: #58715b;
}

.return-card strong {
  color: #906654;
}

.side-card p,
.return-card p {
  margin: 0;
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.side-card p {
  color: #456049;
}

.return-card p {
  color: #5e4f46;
}

.return-card .action-btn {
  width: 100%;
  margin-top: 14px;
}

.action-btn {
  min-width: 168px;
  max-width: 100%;
  min-height: 54px;
  padding: 0 20px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #f8f3ee;
  color: var(--text);
  cursor: pointer;
  transition: transform 0.18s ease, border-color 0.18s ease;
}

.action-btn:hover {
  transform: translateY(-1px);
}

.action-btn.primary {
  background: linear-gradient(135deg, var(--accent), #dfb8a6);
  border-color: #c58975;
  color: #fffdfb;
}

.action-btn[disabled] {
  opacity: 0.45;
  cursor: default;
  pointer-events: none;
}

.mobile-return-panel {
  display: none;
}

.mobile-return-card {
  border-radius: 24px;
  border: 1px solid rgba(220, 206, 194, 0.82);
  background: rgba(255, 250, 245, 0.96);
}

@media (min-width: 68.75em) {
  .page-shell {
    height: min(calc(100vh - 72px), 900px);
    padding: 12px 0;
    grid-template-rows: auto minmax(0, 1fr);
  }

  .step-strip {
    padding: 12px 16px;
  }

  .question-shell {
    height: 100%;
    padding: 14px;
    gap: 14px;
    grid-template-columns: minmax(190px, 220px) minmax(0, 1fr) minmax(260px, 292px);
  }

  .nav-panel,
  .main-panel,
  .side-panel {
    min-height: 0;
    overflow: hidden;
  }

  .nav-panel,
  .side-panel {
    padding: 14px;
    gap: 12px;
  }

  .main-panel {
    padding: 16px;
    gap: 10px;
    grid-template-rows: 10% 8% 14% minmax(0, 1fr) 14%;
  }

  .nav-list {
    height: 100%;
    gap: 1.8%;
    grid-template-rows: repeat(5, minmax(0, 1fr));
  }

  .nav-item {
    height: 100%;
    padding: 6% 7%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .question-title {
    font-size: clamp(22px, 2.25vw, 34px);
    line-height: 1.15;
  }

  .question-caption,
  .helper-text,
  .progress-label,
  .side-card p,
  .return-card p,
  .store-visual span {
    font-size: 13px;
  }

  .option-card {
    min-height: 0;
    height: 100%;
    padding: 3.4% 3.6%;
  }

  .option-list {
    height: 100%;
    gap: 2.6%;
    grid-template-rows: repeat(3, minmax(0, 1fr));
  }

  .option-title {
    font-size: clamp(16px, 1.35vw, 21px);
    line-height: 1.25;
  }

  .option-desc {
    font-size: 12px;
    line-height: 1.45;
  }

  .option-copy {
    gap: 4px;
    max-width: min(74%, 460px);
  }

  .sub-options {
    height: 100%;
    gap: 2.8%;
  }

  .sub-option,
  .action-btn {
    min-height: 0;
    height: 100%;
  }

  .store-visual {
    min-height: 0;
    height: 100%;
    padding: 14px;
    min-width: 0;
  }

  .side-panel {
    grid-template-rows: minmax(0, 1fr) auto auto;
    min-width: 0;
    align-content: stretch;
  }

  .side-card,
  .return-card {
    padding: 12px;
  }

  .side-card,
  .return-card,
  .store-visual {
    min-height: 0;
  }

  .return-card .action-btn {
    margin-top: 10px;
    min-height: 42px;
    height: auto;
  }

  .nav-item .label {
    font-size: clamp(13px, 1.05vw, 16px);
    line-height: 1.25;
  }

  .nav-item .no,
  .option-label,
  .side-card strong,
  .return-card strong {
    font-size: 11px;
  }
}

@media (min-width: 48em) and (max-width: 68.6875em) {
  .page-shell {
    padding: 14px 0 20px;
    gap: 12px;
  }

  .step-strip {
    display: none;
  }

  .question-shell {
    padding: 14px;
    gap: 14px;
    grid-template-columns: minmax(0, 1fr);
  }

  .nav-panel {
    display: none;
  }

  .main-panel {
    grid-column: 1 / -1;
    padding: 18px;
    gap: 14px;
  }

  .question-title {
    font-size: clamp(26px, 3.4vw, 40px);
  }

  .option-card {
    min-height: 112px;
    padding: 16px;
  }

  .option-copy {
    max-width: min(78%, 440px);
  }

  .side-panel {
    grid-column: 1 / -1;
    padding: 14px;
    gap: 12px;
    grid-template-columns: 1fr 1fr 1.2fr;
    grid-template-rows: auto;
    align-items: stretch;
  }

  .store-visual {
    min-height: 220px;
    order: 3;
  }

  .store-visual span {
    max-width: 100%;
  }

  .side-card {
    order: 2;
  }

  .return-card {
    order: 1;
  }
}

@media (max-width: 47.9375em) {
  html {
    scroll-padding-top: 96px;
  }

  .question-shell {
    width: 100%;
    margin: 0 auto;
    grid-template-columns: 1fr;
    padding: 14px;
    gap: 12px;
  }
  .step-strip {
    width: min(1240px, calc(100% - 16px));
  }

  .step-strip {
    display: none;
  }

  .main-nav ul {
    gap: 8px;
    width: 100%;
    min-width: 0;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: flex-start;
  }

  .main-nav li {
    flex: 1 1 0;
  }

  .main-nav button {
    min-height: 36px;
    padding: 0 12px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .nav-text {
    display: none;
  }

  .nav-icon {
    display: inline-block;
  }

  .page-shell {
    padding-top: 10px;
    justify-items: center;
  }

  .nav-panel,
  .main-panel,
  .side-panel {
    padding: 16px;
  }

  .nav-panel {
    display: none;
  }

  .main-panel {
    order: 1;
  }

  .side-panel {
    display: none;
  }

  .mobile-return-panel {
    display: block;
    width: 100%;

      { id: "Q4", nav: "使いたい時", title: "どんな時に使いたいですか？", caption: "使う場面を先に決めると、強さや余韻のちょうどよさが見えやすくなります。", helper: "香りを使う場面に近いものを選んでください", noteTitle: "豆知識＜香りのシーン設計＞", noteBody: "同じ香りでも、使う時間帯や場面によって『ちょうどよい強さ』は変わります。", footer: "休日、仕事、夜時間では、似合う香りの抜け方も少しずつ変わります。", options: [{ key: "A", title: "休日に気分を上げたい", desc: "明るい昼の室内と軽い花材。少し気分が上がる軽快さ。", visual: "url('img/questionnaire/うきうきおはっな.png')", color: "#f9f0ea", cardClass: "option-card-image-right" }, { key: "B", title: "仕事や外出で心地よく整えたい", desc: "白とグレージュの整い。毎日使いやすい清潔感のある方向。", visual: "url('img/questionnaire/きったくごーん.png')", color: "#f3f6f1", cardClass: "option-card-image-right" }, { key: "C", title: "夜や特別な時間を深く楽しみたい", desc: "少し影のある花材と静かなテーブル。余韻を楽しむ落ち着き。", visual: "url('img/questionnaire/特別な夜.png')", color: "#f3eeeb", cardClass: "option-card-image-right" }], subOptions: ["全部好き", "この中にはない"] },
      { id: "Q5", nav: "好きな音楽", title: "好きな音楽は何ですか？", caption: "テンポや余韻の好みから、香りの立ち上がり方や残り方を見ていきます。", helper: "音の雰囲気にいちばん近いものを選んでください", noteTitle: "豆知識＜香りとリズム＞", noteBody: "音楽の好みは、香りの『立ち上がりの軽さ』や『余韻の長さ』の好みに重なることがあります。", footer: "5問目まで来ると、次の深掘り質問に進む準備がほぼ整います。", options: [{ key: "A", title: "明るいポップ", desc: "軽快で明るい空気感。ぱっと抜けるような軽やかさ。", visual: "url('img/questionnaire/虹色ポップスカイ.png')", color: "#f1f6fd", cardClass: "option-card-image-right" }, { key: "B", title: "心にしみるストリングス", desc: "やわらかな布と花。繊細で感情に寄り添うやさしい温度。", visual: "url('img/questionnaire/弦と薔薇と.png')", color: "#f6efea", cardClass: "option-card-image-right" }, { key: "C", title: "自然に耳に残るクラシック", desc: "木の質感と静かな影。上品で洗練された余韻。", visual: "url('img/questionnaire/バーリチュース.png')", color: "#f1eee7", cardClass: "option-card-image-right" }], subOptions: ["全部好き", "この中にはない"] }
    ];
    const SCORING_CONFIG_KEY = "fragranceScoringConfig";
    const SCORE_STATE_KEY = "fragranceScoreState";
    const STEP1_ANSWERS_KEY = "fragranceStep1Answers";
    const answers = {};
    const answerKeys = {};
    let currentIndex = 0;
    const navList = document.getElementById("nav-list");
    const optionList = document.getElementById("option-list");
    const subOptions = document.getElementById("sub-options");
    const questionIndex = document.getElementById("question-index");
    const helperText = document.getElementById("helper-text");
    const progressBar = document.getElementById("progress-bar");
    const progressLabel = document.getElementById("progress-label");
    const questionTitle = document.getElementById("question-title");
    const questionCaption = document.getElementById("question-caption");
    const noteTitle = document.getElementById("note-title");
    const noteBody = document.getElementById("note-body");
    const brandLink = document.getElementById("brand-link");
    const returnTopBtn = document.getElementById("return-top-btn");
    const returnTopBtnMobile = document.getElementById("return-top-btn-mobile");
    const headerPrevBtn = document.getElementById("header-prev-btn");
    const headerNextBtn = document.getElementById("header-next-btn");
    const headerNextText = headerNextBtn.querySelector(".nav-text");

    function cloneConfig(config) {
      return JSON.parse(JSON.stringify(config));
    }

    function getQuestionTextOverride(config, questionId) {
      const root = config?.questionTextOverrides || config?.questionOverrides || {};
      return root.step1?.[questionId] || root[questionId] || null;
    }

    function applyQuestionTextOverride(question, override) {
      if (!override) return;
      if (typeof override.title === "string" && override.title.trim()) {
        question.title = override.title;
      }
      Object.entries(override.answers || {}).forEach(([answerKey, label]) => {
        if (typeof label !== "string" || !label.trim()) return;
        const option = question.options.find((item) => item.key === answerKey);
        if (option) option.title = label;
        if (answerKey === "ALL" && question.subOptions?.[0]) question.subOptions[0] = label;
        if (answerKey === "NONE" && question.subOptions?.[1]) question.subOptions[1] = label;
      });
    }

    function applyQuestionTextOverrides(config) {
      questions.forEach((question) => {
        applyQuestionTextOverride(question, getQuestionTextOverride(config, question.id));
      });
    }

    function isExpectedScoringConfig(config) {
      return Boolean(
        config &&
        config.logicSource === SCORING_LOGIC_SOURCE &&
        config.logicVersion === SCORING_LOGIC_VERSION &&
        config.step1ScoreMap?.Q1?.ALL &&
        config.q8ScoreMap?.ALL &&
        Object.prototype.hasOwnProperty.call(config.finishTemplates || {}, "A")
      );
    }

    function createInitialAxes(config) {
      return Object.fromEntries(config.axisOrder.map((axis) => [axis, config.initialAxisScore]));
    }

    function cloneAxes(axes) {
      return { ...axes };
    }

    function clampValue(value, min = 0, max = 100) {
      return Math.min(max, Math.max(min, Math.round(value)));
    }

    function clampAxes(axes) {
      const nextAxes = {};
      MASTER_SCORING_CONFIG.axisOrder.forEach((axis) => {
        nextAxes[axis] = clampValue(axes[axis] ?? MASTER_SCORING_CONFIG.initialAxisScore);
      });
      return nextAxes;
    }

    function applyDelta(axes, delta, weight = 1) {
      if (!delta) return clampAxes(axes);
      const nextAxes = cloneAxes(axes);
      Object.entries(delta).forEach(([axis, value]) => {
        nextAxes[axis] = (nextAxes[axis] ?? MASTER_SCORING_CONFIG.initialAxisScore) + (value * weight);
      });
      return clampAxes(nextAxes);
    }

    function applySubOptionAdjustment(axes, primaryAxes, answerKey, weight = 1) {
      if (answerKey !== "ALL" && answerKey !== "NONE") return clampAxes(axes);
      const nextAxes = cloneAxes(axes);
      MASTER_SCORING_CONFIG.axisOrder.forEach((axis) => {
        const isPrimary = primaryAxes.includes(axis);
        if (answerKey === "ALL" && isPrimary) nextAxes[axis] += 1 * weight;
        if (answerKey === "NONE") nextAxes[axis] += (isPrimary ? -1 : 1) * weight;
      });
      return clampAxes(nextAxes);
    }

    function scoreQuestionAnswer(axes, answerKey, deltaMap, primaryAxes, weight = 1) {
      if (deltaMap?.[answerKey]) {
        return applyDelta(axes, deltaMap[answerKey], weight);
      }
      if (answerKey === "ALL" || answerKey === "NONE") {
        return applySubOptionAdjustment(axes, primaryAxes, answerKey, weight);
      }
      return applyDelta(axes, deltaMap?.[answerKey], weight);
    }

    function calculateWeightedDistance(a, b, weights) {
      return MASTER_SCORING_CONFIG.axisOrder.reduce((total, axis) => {
        const weight = weights?.[axis] ?? 1;
        return total + (Math.abs((a[axis] ?? 0) - (b[axis] ?? 0)) * weight);
      }, 0);
    }

    function calculateBranchKey(axes, config) {
      const branchOrder = ["floral", "fresh", "woody"];
      let winner = "floral";
      let bestDistance = Number.POSITIVE_INFINITY;
      branchOrder.forEach((branchKey) => {
        const distance = calculateWeightedDistance(axes, config.branchTemplates[branchKey], config.branchDistanceWeights);
        if (distance < bestDistance) {
          bestDistance = distance;
          winner = branchKey;
        }
      });
      return winner;
    }

    function calculateNearestProfile(axes, profiles) {
      let winnerKey = null;
      let winnerProfile = null;
      let bestDistance = Number.POSITIVE_INFINITY;
      Object.entries(profiles).forEach(([profileKey, profile]) => {
        const distance = calculateWeightedDistance(axes, profile.axes, null);
        if (distance < bestDistance) {
          bestDistance = distance;
          winnerKey = profileKey;
          winnerProfile = profile;
        }
      });
      return { profileKey: winnerKey, profile: winnerProfile };
    }

    function scoreStep1Answers(step1AnswerKeys, config) {
      let axes = createInitialAxes(config);
      questions.forEach((question) => {
        const answerKey = step1AnswerKeys[question.id];
        if (!answerKey) return;
        axes = scoreQuestionAnswer(
          axes,
          answerKey,
          config.step1ScoreMap[question.id],
          config.step1PrimaryAxes[question.id] || [],
          config.questionWeights.step1
        );
      });
      return clampAxes(axes);
    }

    function persistScoringConfig(config) {
      sessionStorage.setItem(SCORING_CONFIG_KEY, JSON.stringify(config));
    }

    function persistScoreState(payload) {
      let currentState = {};
      try {
        currentState = JSON.parse(sessionStorage.getItem(SCORE_STATE_KEY) || "{}") || {};
      } catch (error) {
        currentState = {};
      }
      const nextState = {
        ...currentState,
        ...payload,
        updatedAt: new Date().toISOString()
      };
      sessionStorage.setItem(SCORE_STATE_KEY, JSON.stringify(nextState));
      return nextState;
    }

    function saveStep1ScoreState() {
      const config = getCurrentScoringConfig();
      const axesAfterStep1 = scoreStep1Answers(answerKeys, config);
      const branchKey = calculateBranchKey(axesAfterStep1, config);
      const nearestProfile = calculateNearestProfile(axesAfterStep1, config.summaryProfiles);
      persistScoringConfig(config);
      persistScoreState({
        step1Answers: { ...answers },
        step1AnswerKeys: { ...answerKeys },
        step2Answers: {},
        step2AnswerKeys: {},
        branchKey,
        axesAfterStep1,
        axesAfterStep2: null,
        finalAxes: axesAfterStep1,
        resetAxes: axesAfterStep1,
        selectedFinish: null,
        profileKey: nearestProfile.profileKey,
        questionnaireResultId: null,
        questionnaireResultCode: null,
        questionnaireFlowStatus: "in_progress",
        questionnaireSyncError: null,
        questionnaireCompletedAt: null
      });
    }

    function getCurrentScoringConfig() {
      try {
        const parsed = JSON.parse(sessionStorage.getItem(SCORING_CONFIG_KEY) || "null");
        if (isExpectedScoringConfig(parsed)) return parsed;
      } catch (error) {
        console.error("Failed to read scoring config from sessionStorage.", error);
      }
      return cloneConfig(MASTER_SCORING_CONFIG);
    }

    async function initializeScoringConfig() {
      const remoteConfig = await window.FragrancePublicData?.loadActiveScoringConfig?.();
      const config = isExpectedScoringConfig(remoteConfig) ? remoteConfig : cloneConfig(MASTER_SCORING_CONFIG);
      persistScoringConfig(config);
      applyQuestionTextOverrides(config);
    }

    function persistStep1Answers() {
      sessionStorage.setItem(STEP1_ANSWERS_KEY, JSON.stringify(answers));
    }

    function hasAnyAnswer() {
      return Object.keys(answers).length > 0;
    }

    function confirmReturnToTop() {
      if (!hasAnyAnswer()) return true;
      return window.confirm("トップページへ戻ると、ここまでの回答は破棄されます。戻りますか？");
    }

    function returnToTop() {
      if (!confirmReturnToTop()) return;
      window.location.href = "../index.html";
    }

    function goToStep2() {
      persistStep1Answers();
      saveStep1ScoreState();
      window.location.href = "questionnaire_step2.html";
    }

    function moveNext() {
      if (currentIndex < questions.length - 1) {
        currentIndex += 1;
        render();
        return;
      }
      goToStep2();
    }

    function movePrev() {
      if (currentIndex > 0) {
        currentIndex -= 1;
        render();
      }
    }

    function resolveSubOptionKey(index) {
      if (index === 0) return "ALL";
      if (index === 1) return "NONE";
      return null;
    }

    function selectAnswer(question, value, scoreKey) {
      answers[question.id] = value;
      answerKeys[question.id] = scoreKey;
      persistStep1Answers();
      render();
      window.setTimeout(() => { moveNext(); }, 140);
    }

    function renderNav() {
      navList.innerHTML = "";
      questions.forEach((question, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "nav-item";
        if (index === currentIndex) button.classList.add("active");
        else if (answers[question.id]) button.classList.add("done");
        button.innerHTML = `<span class="no">${question.id}</span><span class="label">${question.nav}</span>`;
        button.addEventListener("click", () => {
          currentIndex = index;
          render();
        });
        navList.appendChild(button);
      });
    }

    function renderOptions(question) {
      optionList.innerHTML = "";
      question.options.forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option-card";
        if (option.cardClass) button.classList.add(option.cardClass);
        if (answerKeys[question.id] === option.key) button.classList.add("selected");
        button.style.backgroundImage = option.visual;
        button.style.backgroundColor = option.color || "#fffdfa";
        button.innerHTML = `<div class="option-copy"><span class="option-label">${option.key}</span><span class="option-title">${option.title}</span><span class="option-desc">${option.desc}</span></div>`;
        button.addEventListener("click", () => selectAnswer(question, option.title, option.key));
        optionList.appendChild(button);
      });
    }

    function renderSubOptions(question) {
      subOptions.innerHTML = "";
      question.subOptions.forEach((label, index) => {
        const scoreKey = resolveSubOptionKey(index);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "sub-option";
        if (answerKeys[question.id] === scoreKey) button.classList.add("selected");
        button.textContent = label;
        button.addEventListener("click", () => selectAnswer(question, label, scoreKey));
        subOptions.appendChild(button);
      });
    }

    function updateButtons() {
      const onLastQuestion = currentIndex === questions.length - 1;
      headerPrevBtn.disabled = currentIndex === 0;
      headerNextText.textContent = onLastQuestion ? "STEP2 へ進む" : "次の質問";
      headerNextBtn.setAttribute("aria-label", onLastQuestion ? "STEP2 へ進む" : "次の質問");
    }

    function render() {
      const question = questions[currentIndex];
      const progress = ((currentIndex + 1) / questions.length) * 100;
      renderNav();
      renderOptions(question);
      renderSubOptions(question);
      questionIndex.textContent = `${question.id} / STEP1`;
      helperText.textContent = question.helper;
      progressBar.style.width = `${progress}%`;
      progressLabel.textContent = `${currentIndex + 1} / ${questions.length}`;
      questionTitle.textContent = question.title;
      questionCaption.textContent = question.caption;
      noteTitle.innerHTML = question.noteTitle.replace("・・", "<br>・・");
      noteBody.textContent = question.noteBody;
      updateButtons();
    }

    brandLink.addEventListener("click", (event) => {
      event.preventDefault();
      returnToTop();
    });
    returnTopBtn.addEventListener("click", returnToTop);
    returnTopBtnMobile.addEventListener("click", returnToTop);
    headerPrevBtn.addEventListener("click", movePrev);
    headerNextBtn.addEventListener("click", moveNext);
    initializeScoringConfig().finally(render);
  </script>
