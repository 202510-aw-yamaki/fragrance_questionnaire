<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>香りのアンケート | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
</head>
<body data-page="questionnaire">
  <header class="site-header">
    <div class="site-header-inner site-container">
      <a class="brand" id="brand-link" href="../index.html"><span class="brand-mark">✦</span><span>Fragrance Workshop</span></a>
      <div class="progress-card"><strong id="question-index">1 / 5</strong><div class="progress-track"><span class="progress-fill" id="progress-bar"></span></div><div id="question-stepper"></div></div>
    </div>
  </header>
  <main class="page-hero">
    <div class="page-shell">
      <h1>香りのアンケート</h1>
      <p class="page-copy" id="helper-text">今の気分や好きな雰囲気から、香りの方向性を見つけます。</p>
      <div class="question-layout">
        <section class="question-card">
          <p class="eyebrow" id="progress-label">1 / 5</p>
          <h2 id="question-title"></h2>
          <p class="admin-note" id="question-caption"></p>
          <div class="option-grid" id="option-list"></div>
          <div id="sub-options"></div>
          <div class="question-footer">
            <button class="btn secondary" id="header-prev-btn" type="button">戻る</button>
            <button class="btn primary" id="header-next-btn" type="button">次へ</button>
          </div>
        </section>
        <aside class="page-hero-aside">
          <h2 id="note-title">香り5軸</h2>
          <p class="admin-note" id="note-body">選んだ内容が5軸に反映されます。</p>
          <div id="axis-preview"></div>
        </aside>
      </div>
      <button class="btn secondary" id="return-top-btn" type="button">トップへ戻る</button>
      <button class="btn secondary" id="return-top-btn-mobile" type="button">トップへ戻る</button>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/fragrance-master-data.js"></script>
  <script src="../js/public-data.js"></script>
  <script src="../js/rebuild-customer-flow.js"></script>
</body>
</html>
