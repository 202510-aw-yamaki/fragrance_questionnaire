<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>香りのアンケート | Fragrance Workshop</title>
  <link rel="stylesheet" href="../assets/css/rebuild-ui.css">
  <link rel="stylesheet" href="../assets/css/customer/customer-questionnaire.css">
</head>
<body data-page="questionnaire">
  <header class="site-header">
    <div class="site-header-inner site-container">
      <a class="brand" id="brand-link" href="../index.html"><span class="brand-logo-mark"><img src="../assets/img/customer/吟ロゴ.png" alt=""></span><span>Fragrance Workshop</span></a>
      <div class="progress-card questionnaire-progress-card">
        <span class="questionnaire-progress-mark" aria-hidden="true"></span>
        <strong id="question-index">1 / 5</strong>
        <div class="progress-track"><span class="progress-fill" id="progress-bar"></span></div>
        <div id="question-stepper"></div>
      </div>
    </div>
  </header>
  <main class="page-hero questionnaire-main">
    <div class="page-shell questionnaire-shell">
      <div class="questionnaire-hero">
        <div class="questionnaire-heading">
          <h1 id="question-title">香りのアンケート</h1>
        </div>
      </div>
      <div class="question-layout">
        <section class="question-card">
          <p class="eyebrow" id="progress-label">1 / 5</p>
          <span class="question-card-divider" aria-hidden="true"></span>
          <p class="admin-note" id="question-caption"></p>
          <div class="option-grid" id="option-list"></div>
          <div id="sub-options"></div>
          <div class="question-footer">
            <button class="btn secondary" id="header-prev-btn" type="button">戻る</button>
            <button class="btn primary" id="header-next-btn" type="button">次へ</button>
            <p class="question-reflection-note" id="question-reflection-note">香り5軸に反映されます</p>
          </div>
        </section>
        <aside class="page-hero-aside">
          <h2 id="note-title">香り5軸とは？</h2>
          <p class="admin-note" id="note-body">あなたの感性を5つの軸で分析し、ぴったりの香りの方向性を導き出します。</p>
          <div id="axis-preview"></div>
        </aside>
      </div>
      <button class="btn secondary" id="return-top-btn" type="button">トップへ戻る</button>
      <button class="btn secondary" id="return-top-btn-mobile" type="button">トップへ戻る</button>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/fragrance-master-data.js"></script>
  <script src="../assets/js/public-data.js"></script>
  <script src="../assets/js/rebuild-customer-flow.js"></script>
</body>
</html>
