<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スタッフ確認ページ | Fragrance Workshop</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin-common.css">
  <link rel="stylesheet" href="css/admin-rebuild.css">
</head>
<body class="page-canvas admin-page portal-staff-dashboard-page">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main site-container portal-stack">
    <section class="admin-panel portal-hero">
      <div class="portal-hero-copy-block">
        <p class="portal-hero-label">DASHBOARD</p>
        <h1 id="staff-dashboard-heading">本日【--/--（-）】の予定確認ページ</h1>
      </div>
      <div class="portal-hero-side">
        <div class="portal-inline-metric">
          <span>本日の予約件数</span>
          <strong id="staff-kpi-today">0</strong>
        </div>
        <p class="admin-note" id="staff-dashboard-note">担当スタッフを確認中です。</p>
      </div>
    </section>

    <section class="portal-staff-layout">
      <article class="admin-panel portal-calendar-panel">
        <div class="day-view">
          <div class="day-nav">
            <div class="day-nav-title">
              <p class="portal-hero-label portal-hero-label--muted">DAY VIEW</p>
              <h2 id="staff-day-current-label">本日の予定</h2>
            </div>
            <div class="admin-actions">
              <button class="admin-btn secondary" id="staff-day-prev" type="button">前日</button>
              <button class="admin-btn secondary" id="staff-day-next" type="button">翌日</button>
            </div>
          </div>
          <div class="day-timeline" id="staff-day-timeline"></div>
        </div>
      </article>

      <aside class="portal-side-stack">
        <article class="admin-panel portal-stat-card">
          <p class="portal-stat-label">向こう一週間の予約件数 / 作成枠数</p>
          <strong class="portal-stat-value" id="staff-kpi-week">0</strong>
          <p class="admin-note">左が予約件数、右が作成枠数です。</p>
        </article>

        <article class="admin-panel portal-stat-card">
          <p class="portal-stat-label">向こう二週間の予約未作成日</p>
          <strong class="portal-stat-value portal-stat-value--compact" id="staff-missing-primary" hidden>--/--</strong>
          <div class="admin-chip-grid" id="staff-missing-secondary"></div>
          <p class="admin-note" id="staff-missing-note" hidden>休日 / 非出勤日を除いた未作成日を表示します。</p>
        </article>

        <a class="admin-panel portal-action-card" href="admin-slots.html?role=staff">
          <h3>予約枠作成ページへ</h3>
          <p class="admin-note">単件作成と一括作成を開きます。</p>
        </a>

        <a class="admin-panel portal-action-card" href="admin-reservations.html?role=staff">
          <h3>予約情報一覧ページへ</h3>
          <p class="admin-note">来店前の予約一覧と詳細導線を確認します。</p>
        </a>
      </aside>
    </section>

    <section class="admin-panel portal-detail-panel">
      <div class="portal-section-head">
        <div>
          <h2>当日のイベント詳細</h2>
          <p class="admin-note">予約枠と予約状況を時間順に表示します。</p>
        </div>
      </div>
      <div class="day-list" id="staff-day-events"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-data.js"></script>
  <script src="js/staff-dashboard-page.js"></script>
</body>
</html>
