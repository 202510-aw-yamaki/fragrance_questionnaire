<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スタッフ・管理者ログイン | Fragrance Workshop</title>
  <link rel="stylesheet" href="../assets/css/admin/admin-ui.css">
</head>
<body class="admin-login-page" data-page="admin-login">
  <main class="admin-login-stage">
    <div class="admin-login-bg" aria-hidden="true"></div>
    <div class="admin-login-shell">
      <header class="admin-login-topbar">
        <a class="admin-login-brand" href="../index.html">
          <span class="admin-login-brand-logo"><img src="../assets/img/top/吟ロゴ.png" alt=""></span>
          <span class="admin-login-brand-copy">
            <strong>Fragrance Atelier</strong>
            <small>WORKSHOP ADMIN SYSTEM</small>
          </span>
        </a>
        <p>管理者専用ページ</p>
      </header>

      <div class="admin-login-layout">
        <section class="admin-login-card">
          <div class="admin-login-tabs" role="tablist" aria-label="ログイン種別">
            <button class="portal-login-tab is-active" id="staff-login-tab" type="button" role="tab" aria-selected="true" aria-controls="staff-login-panel" data-login-tab="staff">スタッフログイン</button>
            <button class="portal-login-tab" id="manager-login-tab" type="button" role="tab" aria-selected="false" aria-controls="manager-login-panel" data-login-tab="manager">管理者ログイン</button>
          </div>

          <p class="admin-error" id="config-error" hidden>Supabase 設定が未完了です。assets/js/supabase-config.js を設定してください。</p>
          <p class="admin-error" id="login-error" hidden></p>

          <section class="admin-login-panel" id="staff-login-panel" role="tabpanel" aria-labelledby="staff-login-tab">
            <div class="admin-login-panel-head">
              <span class="admin-login-icon" aria-hidden="true">S</span>
              <p>STAFF LOGIN</p>
              <h1>スタッフログイン</h1>
              <span>予約確認・枠作成・QR依頼の対応画面に入ります。</span>
            </div>
            <form class="login-form" data-login-role="staff">
              <label>ログインID<input data-login-field="identifier" type="text" autocomplete="username" required></label>
              <label>パスワード<input data-login-field="password" type="password" autocomplete="current-password" required></label>
              <button class="btn primary admin-login-submit" type="submit">スタッフとしてログイン</button>
            </form>
            <a class="admin-login-help" href="mailto:admin@example.com">パスワードをお忘れの方</a>
          </section>

          <section class="admin-login-panel" id="manager-login-panel" role="tabpanel" aria-labelledby="manager-login-tab" hidden>
            <div class="admin-login-panel-head">
              <span class="admin-login-icon" aria-hidden="true">A</span>
              <p>ADMIN LOGIN</p>
              <h1>管理者ログイン</h1>
              <span>スタッフ・予約・素材設定を管理する画面に入ります。</span>
            </div>
            <form class="login-form" data-login-role="manager">
              <label>ログインID<input data-login-field="identifier" type="text" autocomplete="username" required></label>
              <label>パスワード<input data-login-field="password" type="password" autocomplete="current-password" required></label>
              <button class="btn gold admin-login-submit" type="submit">管理者としてログイン</button>
            </form>
            <a class="admin-login-help" href="mailto:admin@example.com">パスワードをお忘れの方</a>
          </section>
        </section>

        <aside class="admin-login-guide" aria-label="ログイン後の機能">
          <section>
            <div class="admin-login-guide-role">
              <span class="admin-login-role-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <circle cx="12" cy="7" r="4"></circle>
                  <path d="M5.5 21a6.5 6.5 0 0 1 13 0"></path>
                </svg>
              </span>
              <p>スタッフ</p>
            </div>
            <div class="admin-login-feature-list">
              <article>
                <span class="admin-login-feature-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <rect x="4" y="5" width="16" height="15" rx="2"></rect>
                    <path d="M8 3v4M16 3v4M4 10h16M12 13v5M9.5 15.5h5"></path>
                  </svg>
                </span>
                <strong>予約枠作成</strong>
              </article>
              <article>
                <span class="admin-login-feature-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <rect x="6" y="4" width="12" height="17" rx="2"></rect>
                    <path d="M9 4.5h6M9 10h6M9 14h3M14 16l1.5 1.5L19 14"></path>
                  </svg>
                </span>
                <strong>予約確認</strong>
              </article>
              <article>
                <span class="admin-login-feature-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <circle cx="9" cy="8" r="3"></circle>
                    <path d="M4 20a5 5 0 0 1 10 0M16 8h3a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-3l-3 3v-3"></path>
                  </svg>
                </span>
                <strong>接客ページ</strong>
              </article>
              <article>
                <span class="admin-login-feature-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <rect x="4" y="4" width="5" height="5" rx="1"></rect>
                    <rect x="15" y="4" width="5" height="5" rx="1"></rect>
                    <rect x="4" y="15" width="5" height="5" rx="1"></rect>
                    <path d="M14 14h6v6h-6zM13 7h-2M7 13v-2M11 17h2M17 11v2"></path>
                  </svg>
                </span>
                <strong>ＱＲ・メール対応</strong>
              </article>
            </div>
          </section>
          <section>
            <div class="admin-login-guide-role">
              <span class="admin-login-role-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M12 3 5 6v5c0 5 3.2 8.2 7 10 3.8-1.8 7-5 7-10V6l-7-3Z"></path>
                  <path d="m9.5 12 1.8 1.8 3.7-4"></path>
                </svg>
              </span>
              <p>管理者</p>
            </div>
            <div class="admin-login-feature-list">
              <article>
                <span class="admin-login-feature-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <circle cx="10" cy="8" r="3"></circle>
                    <path d="M4 20a6 6 0 0 1 12 0M18 11v6M15 14h6"></path>
                  </svg>
                </span>
                <strong>スタッフ管理</strong>
              </article>
              <article>
                <span class="admin-login-feature-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M4 7h10M18 7h2M4 17h4M12 17h8M10 5v4M16 15v4"></path>
                  </svg>
                </span>
                <strong>素材・配点設定</strong>
              </article>
              <article>
                <span class="admin-login-feature-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <rect x="4" y="4" width="5" height="5" rx="1"></rect>
                    <rect x="15" y="4" width="5" height="5" rx="1"></rect>
                    <rect x="4" y="15" width="5" height="5" rx="1"></rect>
                    <path d="M15 15h2M20 15h-1M17 17v3M20 20h-5M12 7h1M7 12v1"></path>
                  </svg>
                </span>
                <strong>ＱＲ関連設定</strong>
              </article>
            </div>
          </section>
        </aside>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script src="../assets/js/admin-login-page.js"></script>
</body>
</html>
