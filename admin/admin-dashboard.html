<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理者ダッシュボード | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
</head>
<body class="admin-page" data-page="admin-dashboard">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main">
    <section class="admin-page-title"><div><span class="eyebrow">Admin Dashboard</span><h1>管理者ダッシュボード</h1></div></section>
    <section class="kpi-grid">
      <article class="admin-panel kpi-card"><span class="decor-icon">□</span><div><p>本日の予約</p><strong class="kpi-value" id="kpi-reservations">0</strong><small id="kpi-reservations-week">0</small></div></article>
      <article class="admin-panel kpi-card"><span class="decor-icon">□</span><div><p>予約枠</p><strong class="kpi-value" id="kpi-slots">0</strong></div></article>
      <article class="admin-panel kpi-card"><span class="decor-icon">□</span><div><p>配点</p><strong class="kpi-value" id="kpi-scoring">-</strong></div></article>
      <article class="admin-panel kpi-card"><span class="decor-icon">□</span><div><p>原料</p><strong class="kpi-value" id="kpi-materials">0</strong></div></article>
    </section>
    <section class="dashboard-grid section">
      <article class="admin-panel"><h2>本日の出勤</h2><div id="manager-today-shifts" class="portal-list-body"></div></article>
      <article class="admin-panel"><h2>QR関連通知</h2><strong class="kpi-value" id="manager-qr-request-count">0</strong><div id="manager-qr-request-list" class="portal-list-body"></div></article>
      <article class="admin-panel"><h2>翌週の予約枠</h2><div id="manager-next-week-summary" class="portal-list-body"></div></article>
      <article class="admin-panel"><h2>枠カバー状況</h2><div id="manager-slot-coverage" class="portal-list-body"></div></article>
      <article class="admin-panel"><h2>配点ロジック</h2><div id="manager-scoring-weight-summary"></div><div id="manager-scoring-summary"></div></article>
      <article class="admin-panel"><h2>原料ポイント</h2><div id="manager-material-links" class="portal-list-body"></div></article>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-data.js"></script>
  <script src="../js/fragrance-master-data.js"></script>
  <script src="../js/admin-dashboard-page.js"></script>
</body>
</html>
