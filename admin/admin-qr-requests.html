<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR依頼一覧 | Fragrance Workshop</title>
  <style>
    :root {
      --bg: #f7f1ea;
      --panel: #fffdf9;
      --text: #2f2923;
      --muted: #74685e;
      --line: #e5d8cc;
      --accent: #8f5f3e;
      --accent-soft: #f0e1d4;
      --danger-soft: #fae8df;
      --container: min(1180px, calc(100vw - 32px));
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 360px;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.7;
    }

    .site-container {
      width: var(--container);
      margin: 0 auto;
    }

    .admin-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 241, 234, 0.92);
      backdrop-filter: blur(12px);
    }

    .admin-header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .admin-brand,
    .admin-nav a,
    .admin-logout,
    .admin-btn {
      text-decoration: none;
      color: inherit;
      font: inherit;
      font-weight: 700;
    }

    .admin-brand {
      display: grid;
      line-height: 1.25;
    }

    .admin-brand-meta {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .admin-header-actions,
    .admin-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .admin-nav a,
    .admin-logout,
    .admin-btn {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fffaf4;
      cursor: pointer;
    }

    .admin-nav a.active,
    .admin-btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .admin-main {
      padding: 32px 0 48px;
      display: grid;
      gap: 18px;
    }

    .admin-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 36px rgba(75, 51, 33, 0.08);
    }

    .portal-hero,
    .qr-request-list-section {
      padding: clamp(20px, 4vw, 32px);
    }

    .portal-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
    }

    .portal-hero-label {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(1.9rem, 4vw, 3rem);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .admin-note {
      margin-bottom: 0;
      color: var(--muted);
    }

    .portal-filter-form {
      display: flex;
      align-items: end;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    input,
    select {
      min-height: 42px;
      min-width: 190px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf4;
      color: var(--text);
      font: inherit;
      padding: 0 12px;
    }

    .portal-list-head,
    .qr-request-row {
      display: grid;
      grid-template-columns: 1.1fr 1fr 1.2fr 0.9fr 1.1fr 0.9fr 0.95fr 1.05fr 1fr 0.7fr;
      gap: 10px;
      align-items: center;
    }

    .portal-list-head {
      padding: 0 0 12px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .portal-list-body {
      display: grid;
      gap: 10px;
    }

    .qr-request-row {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf4;
    }

    .qr-request-cell {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 0.92rem;
    }

    .qr-request-cell strong {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.82rem;
    }

    .admin-empty {
      margin: 14px 0 0;
      padding: 16px;
      border: 1px dashed #d7c5b6;
      border-radius: 8px;
      color: var(--muted);
      background: #fffaf4;
    }

    @media (max-width: 980px) {
      .admin-header-inner,
      .portal-hero {
        align-items: stretch;
        grid-template-columns: 1fr;
      }

      .admin-header-inner {
        padding: 14px 0;
        flex-direction: column;
      }

      .portal-filter-form {
        justify-content: stretch;
      }

      label,
      input,
      select,
      .admin-btn {
        width: 100%;
      }

      .portal-list-head {
        display: none;
      }

      .qr-request-row {
        grid-template-columns: 1fr;
      }

      .qr-request-cell::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 800;
      }
    }
  </style>
</head>

<body class="page-canvas admin-page qr-requests-page">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main site-container">
    <section class="admin-panel portal-hero">
      <div>
        <p class="portal-hero-label">QR Requests</p>
        <h1>QR依頼一覧</h1>
        <p class="admin-note">QR商品作成依頼を読み取り専用で確認します。作成可否・発送先・発送完了の操作は後続フェーズです。</p>
      </div>
      <form class="portal-filter-form" id="qr-request-filter-form">
        <label>状態
          <select id="qr-request-status-filter">
            <option value="">すべて</option>
            <option value="requested">依頼受付</option>
            <option value="available_email_sent">作成可能メール済み</option>
            <option value="reminder_email_sent">再案内済み</option>
            <option value="expired">期限切れ</option>
            <option value="unavailable">作成不可</option>
            <option value="shipping_pending">発送準備中</option>
            <option value="shipped">発送完了</option>
            <option value="auto_unavailable_overdue">期限超過不可</option>
          </select>
        </label>
        <label>検索
          <input id="qr-request-keyword-filter" type="search" placeholder="依頼番号・商品名・担当">
        </label>
        <button class="admin-btn primary" type="submit">絞り込み</button>
      </form>
    </section>

    <section class="admin-panel qr-request-list-section">
      <div class="portal-list-head">
        <span>受付</span>
        <span>依頼番号</span>
        <span>商品</span>
        <span>数量</span>
        <span>依頼者</span>
        <span>担当</span>
        <span>状態</span>
        <span>期限</span>
        <span>メール</span>
        <span>QRアクセス</span>
      </div>
      <div id="qr-request-rows" class="portal-list-body"></div>
      <p class="admin-empty" id="qr-request-empty" hidden>該当するQR依頼はありません。</p>
      <p class="admin-note">表示件数: <span id="qr-request-count">0</span></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-data.js"></script>
  <script src="../js/qr-requests-page.js"></script>
</body>

</html>
