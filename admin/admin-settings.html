<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基本設定 | Fragrance Workshop</title>
  <link rel="stylesheet" href="admin-ui.css">
  <link rel="stylesheet" href="admin-settings.css">
</head>
<body class="admin-page admin-reference-page admin-settings-page" data-page="admin-settings">
  <header class="admin-header" id="admin-header">
    <div class="admin-header-inner site-container admin-header-inner--manager">
      <a class="admin-brand" href="admin-settings.html?role=manager">
        <span class="admin-brand-logo" aria-hidden="true"><img src="../img/TOP/吟ロゴ.png" alt=""></span>
        <span>Admin Settings</span>
      </a>
      <div class="admin-header-actions">
        <nav class="admin-nav" aria-label="管理メニュー">
          <a data-admin-nav-key="dashboard" href="admin-dashboard.html?role=manager">ダッシュボード</a>
          <a class="active" data-admin-nav-key="settings" href="admin-settings.html?role=manager">基本設定</a>
          <a data-admin-nav-key="scoring" href="admin-scoring.html?role=manager">配点ロジック</a>
          <a data-admin-nav-key="materials" href="admin-materials.html?role=manager">原料ポイント</a>
          <a data-admin-nav-key="qr-settings" href="admin-qr-settings.html?role=manager">QR設定</a>
          <a data-admin-nav-key="portal-staff" href="../staff/staff-dashboard.html?role=staff">スタッフ画面へ</a>
        </nav>
        <button class="admin-logout" type="button">ログアウト</button>
      </div>
    </div>
  </header>
  <main class="admin-main">
    <section class="admin-page-title admin-page-title--center"><div><span class="eyebrow" aria-hidden="true"></span><h1>基本設定</h1></div></section>
    <section class="admin-settings-layout">
      <article class="admin-panel admin-reference-card admin-settings-store-card">
        <h2>店舗情報</h2>
        <form class="admin-form-stack" id="store-public-info-form">
          <label>店舗名<input id="store-name" type="text" value="Fragrance Atelier（フレグランス アトリエ）" autocomplete="organization"></label>
          <label>店舗電話番号<input id="store-phone" type="tel" value="03-1234-5678" autocomplete="tel"></label>
          <div class="admin-inline-fields">
            <label>営業開始時間<input id="store-open-time" type="time" value="10:00"></label>
            <label>営業終了時間<input id="store-close-time" type="time" value="19:00"></label>
          </div>
          <label>定休日<input id="store-closed-days" type="text" value="毎週水曜日"></label>
          <label>店舗LP URL<input id="store-lp-url" type="url" value="https://fragrance-atelier.jp" inputmode="url"></label>
          <p class="admin-note" id="store-public-info-note">公開ページやQR商品ページの店舗情報に利用します。</p>
        </form>
      </article>
      <article class="admin-panel admin-reference-card admin-settings-staff-card">
        <div class="admin-reference-card-head"><h2>スタッフ管理</h2><button class="admin-btn primary" id="staff-create-button" type="button">スタッフを追加</button></div>
        <div class="admin-reference-hidden-controls">
          <label>スタッフ<select id="staff-manage-select"></select></label>
          <button class="admin-btn secondary" id="staff-shift-button" type="button">スタッフ出勤管理</button>
          <label>出勤管理<select id="shift-manage-select"></select></label>
          <p class="admin-note" id="settings-control-note" hidden></p>
          <h3>本日のスタッフ <span id="settings-today-label">--/--</span></h3>
          <div class="admin-card-list" id="settings-today-staff"></div>
        </div>
        <p class="admin-reference-table-label">スタッフ一覧</p>
        <table class="admin-reference-staff-table">
          <thead><tr><th>スタッフ名</th><th>役割</th><th></th></tr></thead>
          <tbody id="settings-staff-table-body">
            <tr><td colspan="3">スタッフ情報を読み込んでいます。</td></tr>
          </tbody>
        </table>
        <p class="admin-note" id="settings-staff-table-note">登録済みスタッフを表示します。</p>
      </article>
    </section>
    <div class="admin-bottom-savebar admin-reference-savebar"><button class="admin-btn gold" id="settings-save-button" type="button">設定を保存</button></div>
    <section class="section grid-2 admin-reference-hidden-live">
      <article class="admin-panel">
        <h2>予約枠カレンダー</h2>
        <p class="admin-note" id="settings-calendar-range">表示期間</p>
        <div class="admin-actions"><button class="admin-btn secondary" id="settings-week-prev" type="button">前週</button><button class="admin-btn secondary" id="settings-week-next" type="button">次週</button></div>
        <table><thead id="settings-calendar-head"></thead><tbody id="settings-calendar-body"></tbody></table>
      </article>
    </section>
  </main>
  <div class="portal-modal" id="staff-modal" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-data.js"></script>
  <script src="../js/admin-settings-page.js"></script>
</body>
</html>
