<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基本設定 | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/rebuild-ui.css">
</head>
<body class="admin-page" data-page="admin-settings">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main">
    <section class="admin-page-title"><div><span class="eyebrow">Settings</span><h1>基本設定・店舗情報</h1></div><button class="admin-btn primary" id="staff-create-button" type="button">スタッフ新規登録</button></section>
    <section class="grid-2">
      <article class="admin-panel"><h2>本日の出勤者 <span id="settings-today-label">--/--</span></h2><div class="admin-card-list" id="settings-today-staff"></div></article>
      <article class="admin-panel"><h2>スタッフ管理</h2><label>スタッフ<select id="staff-manage-select"></select></label><button class="admin-btn secondary" id="staff-shift-button" type="button">スタッフ出勤管理</button><label>出勤管理<select id="shift-manage-select"></select></label><p class="admin-note" id="settings-control-note" hidden></p></article>
    </section>
    <section class="section grid-2">
      <article class="admin-panel">
        <h2>QR商品設定</h2>
        <form class="admin-form-stack" id="qr-product-settings-form">
          <label>10ml 税込価格<input id="qr-price-10ml" type="number" min="0" step="1" inputmode="numeric"></label>
          <label>30ml 税込価格<input id="qr-price-30ml" type="number" min="0" step="1" inputmode="numeric"></label>
          <label>最大依頼容量<input id="qr-max-volume-ml" type="number" min="10" step="10" inputmode="numeric"></label>
          <label>店舗電話番号<input id="qr-shop-phone" type="text"></label>
          <label>受付時間<input id="qr-business-hours" type="text"></label>
          <p class="admin-note" id="qr-settings-note">公開QRページはこの設定を参照します。</p>
          <button class="admin-btn primary" type="submit">保存</button>
        </form>
      </article>
      <article class="admin-panel">
        <h2>予約枠カレンダー</h2>
        <p class="admin-note" id="settings-calendar-range">表示期間</p>
        <div class="admin-actions"><button class="admin-btn secondary" id="settings-week-prev" type="button">前週</button><button class="admin-btn secondary" id="settings-week-next" type="button">次週</button></div>
        <table><thead id="settings-calendar-head"></thead><tbody id="settings-calendar-body"></tbody></table>
      </article>
    </section>
  </main>
  <div class="portal-modal" id="staff-modal" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-data.js"></script>
  <script src="../js/admin-settings-page.js"></script>
</body>
</html>
