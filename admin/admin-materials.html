<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>原料ポイント | Fragrance Workshop</title>
  <link rel="stylesheet" href="admin-ui.css">
  <link rel="stylesheet" href="admin-materials.css">
</head>
<body class="admin-page admin-reference-page admin-materials-page" data-page="admin-materials">
  <header class="admin-header" id="admin-header">
    <div class="admin-header-inner site-container admin-header-inner--manager">
      <a class="admin-brand" href="admin-materials.html?role=manager">
        <span class="admin-brand-logo" aria-hidden="true"><img src="../img/TOP/吟ロゴ.png" alt=""></span>
        <span>Material Points</span>
      </a>
      <div class="admin-header-actions">
        <nav class="admin-nav" aria-label="管理メニュー">
          <a data-admin-nav-key="dashboard" href="admin-dashboard.html?role=manager">ダッシュボード</a>
          <a data-admin-nav-key="settings" href="admin-settings.html?role=manager">基本設定</a>
          <a data-admin-nav-key="scoring" href="admin-scoring.html?role=manager">配点ロジック</a>
          <a class="active" data-admin-nav-key="materials" href="admin-materials.html?role=manager">原料ポイント</a>
          <a data-admin-nav-key="qr-settings" href="admin-qr-settings.html?role=manager">QR設定</a>
          <a data-admin-nav-key="portal-staff" href="../staff/staff-dashboard.html?role=staff">スタッフ画面へ</a>
        </nav>
        <button class="admin-logout" type="button">ログアウト</button>
      </div>
    </div>
  </header>
  <main class="admin-main">
    <section class="admin-material-title-row admin-page-title">
      <div>
        <span class="eyebrow" aria-hidden="true"></span>
        <h1>原料ポイント編集</h1>
      </div>
      <div class="admin-material-title-tools">
        <label>検索<input id="material-search" type="search" placeholder="原料名・コード・タグ"></label>
        <label>カテゴリ<select id="material-filter"><option value="">すべて</option><option value="Top">Top</option><option value="Middle">Middle</option><option value="Last">Last</option></select></label>
        <label>並び替え<select id="material-sort-mode"><option value="sort">表示順</option><option value="name-asc">名前順</option><option value="category-asc">カテゴリ順</option></select></label>
      </div>
    </section>

    <section class="admin-material-status-row" aria-live="polite">
      <p class="admin-note" id="material-seed-status">読み込み中です。</p>
      <p class="admin-note" id="material-count">0件</p>
      <p class="admin-note" id="material-current-sort">表示順</p>
    </section>

    <input id="material-import-file" type="file" accept="application/json" hidden>

    <div class="admin-material-create-modal" id="material-create-modal" hidden>
      <div class="admin-material-modal-backdrop" data-material-create-close></div>
      <section class="admin-material-modal-card" role="dialog" aria-modal="true" aria-labelledby="material-create-title">
        <div class="admin-material-modal-head">
          <h2 id="material-create-title">新規原料を作成</h2>
          <button class="admin-btn secondary" type="button" data-material-create-close>閉じる</button>
        </div>
        <form id="material-create-form">
          <div class="admin-material-create-grid">
            <label>原料コード<input id="material-create-code" required autocomplete="off"></label>
            <label>原料名<input id="material-create-name" required autocomplete="off"></label>
            <label>カテゴリ<select id="material-create-category"><option>Top</option><option>Middle</option><option>Last</option></select></label>
          </div>
          <label class="admin-material-create-tags">任意タグ<input id="material-create-tags" type="text" placeholder="例: フローラル, 軽やか"></label>
          <div class="admin-material-modal-actions">
            <button class="admin-btn secondary" type="button" data-material-create-close>キャンセル</button>
            <button class="admin-btn gold" type="submit">作成して編集</button>
          </div>
        </form>
      </section>
    </div>

    <div class="admin-material-meta-modal" id="material-meta-modal" hidden>
      <div class="admin-material-modal-backdrop" data-material-meta-close></div>
      <section class="admin-material-modal-card" role="dialog" aria-modal="true" aria-labelledby="material-meta-title">
        <div class="admin-material-modal-head">
          <h2 id="material-meta-title">タグとメモを編集</h2>
          <button class="admin-btn secondary" type="button" data-material-meta-close>閉じる</button>
        </div>
        <form id="material-meta-form">
          <label class="admin-material-tags-field">任意タグ<input id="material-tags" type="text" placeholder="例: フローラル, 軽やか, 春"></label>
          <p class="admin-material-modal-help">カンマ区切りで複数のタグを入力できます。</p>
          <div class="admin-material-tag-row" id="material-tag-preview"></div>
          <label class="admin-material-note-field">メモ<textarea id="material-note" rows="5"></textarea></label>
          <div class="admin-material-modal-actions">
            <button class="admin-btn secondary" type="button" data-material-meta-close>キャンセル</button>
            <button class="admin-btn gold" type="submit">反映</button>
          </div>
        </form>
      </section>
    </div>

    <section class="admin-materials-workbench">
      <article class="admin-panel admin-reference-card admin-material-list-card">
        <div class="admin-material-card-head">
          <h2>原料一覧</h2>
          <button class="admin-btn secondary" id="material-create-button" type="button">新規作成</button>
        </div>
        <div id="material-rows" class="admin-material-list" aria-label="原料一覧"></div>
        <nav class="admin-material-pagination" aria-label="原料一覧ページ送り">
          <button class="admin-btn secondary" id="material-page-prev" type="button">前へ</button>
          <span id="material-page-status">1 / 1</span>
          <button class="admin-btn secondary" id="material-page-next" type="button">次へ</button>
        </nav>
        <p class="admin-reference-help">1ページ5件ずつ表示します。原料を選択すると中央で編集できます。</p>
      </article>

      <article class="admin-panel admin-reference-card admin-material-inline-card">
        <div class="admin-material-card-head">
          <h2>原料編集</h2>
          <button class="admin-btn secondary" id="material-reset" type="button">DBから再読込</button>
        </div>
        <form class="admin-material-editor-form" id="material-form">
          <input id="material-id" type="hidden">
          <div class="admin-material-field-grid">
            <label>原料コード<input id="material-code" required autocomplete="off"></label>
            <label>原料名<input id="material-name" required autocomplete="off"></label>
            <label>カテゴリ<select id="material-category"><option>Top</option><option>Middle</option><option>Last</option></select></label>
          </div>
          <div class="admin-material-sub-field-grid">
            <label>表示順位<input id="material-sort" type="number" min="1" step="1" value="1"></label>
            <button class="admin-btn secondary admin-material-meta-button" id="material-meta-edit" type="button">タグ・メモ編集</button>
            <label class="admin-material-active-field"><input id="material-active" type="checkbox" checked> 有効</label>
          </div>
          <h3>5軸スライダー</h3>
          <div class="admin-material-slider-list">
            <label><span>フローラル</span><input id="axis-floral" type="range" min="0" max="100" step="1" value="0"><b id="axis-floral-value">0</b></label>
            <label><span>フレッシュ</span><input id="axis-fresh" type="range" min="0" max="100" step="1" value="0"><b id="axis-fresh-value">0</b></label>
            <label><span>ウッディ</span><input id="axis-woody" type="range" min="0" max="100" step="1" value="0"><b id="axis-woody-value">0</b></label>
            <label><span>スパイシー</span><input id="axis-spicy" type="range" min="0" max="100" step="1" value="0"><b id="axis-spicy-value">0</b></label>
            <label><span>スウィート</span><input id="axis-sweet" type="range" min="0" max="100" step="1" value="0"><b id="axis-sweet-value">0</b></label>
          </div>
          <p class="admin-note" id="material-total-note">合計 <span id="material-total">0</span> / 100</p>
        </form>
      </article>

      <article class="admin-panel admin-reference-card admin-material-preview-panel">
        <h2>グラフ</h2>
        <h3 id="material-preview-name">選択中の原料</h3>
        <div class="admin-material-radar" aria-hidden="true">
          <svg id="material-radar-svg" viewBox="0 0 260 260" role="img" aria-label="5軸グラフ">
            <polygon id="material-radar-polygon" class="radar-value" points="120,120 120,120 120,120 120,120 120,120"></polygon>
          </svg>
        </div>
        <div class="admin-preview-tags" id="material-axis-preview-list" aria-label="設定タグ"></div>
      </article>
    </section>

    <div class="admin-bottom-savebar admin-reference-savebar">
      <div class="admin-material-save-copy">
        <p class="admin-material-save-help">DB保存はデータベースに保存し、次回から自動読込されます。JSON保存は表示中データをローカルに保存します。</p>
        <p class="admin-material-save-state" id="material-save-state" data-state="saved">DBから読込済み</p>
      </div>
      <button class="admin-btn gold" id="material-seed-btn" type="button">DB保存</button>
      <button class="admin-btn secondary" id="material-export-json" type="button">JSON保存</button>
      <button class="admin-btn secondary" id="material-import-trigger" type="button">JSON読込</button>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-data.js"></script>
  <script src="../js/fragrance-master-data.js"></script>
  <script src="../js/admin-materials-page.js"></script>
</body>
</html>
