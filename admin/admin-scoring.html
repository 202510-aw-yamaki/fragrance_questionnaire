<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配点ロジック | Fragrance Workshop</title>
  <link rel="stylesheet" href="../css/admin/admin-ui.css">
  <link rel="stylesheet" href="../css/admin/admin-scoring.css">
</head>
<body class="admin-page admin-reference-page admin-scoring-page" data-page="admin-scoring">
  <header class="admin-header" id="admin-header">
    <div class="admin-header-inner site-container admin-header-inner--manager">
      <a class="admin-brand" href="admin-scoring.html?role=manager">
        <span class="admin-brand-logo" aria-hidden="true"><img src="../img/TOP/吟ロゴ.png" alt=""></span>
        <span>Scoring Logic</span>
      </a>
      <div class="admin-header-actions">
        <nav class="admin-nav" aria-label="管理メニュー">
          <a data-admin-nav-key="dashboard" href="admin-dashboard.html?role=manager">ダッシュボード</a>
          <a data-admin-nav-key="settings" href="admin-settings.html?role=manager">基本設定</a>
          <a class="active" data-admin-nav-key="scoring" href="admin-scoring.html?role=manager">配点ロジック</a>
          <a data-admin-nav-key="materials" href="admin-materials.html?role=manager">原料ポイント</a>
          <a data-admin-nav-key="qr-settings" href="admin-qr-settings.html?role=manager">QR設定</a>
          <a data-admin-nav-key="portal-staff" href="../staff/staff-dashboard.html?role=staff">スタッフ画面へ</a>
        </nav>
        <button class="admin-logout" type="button">ログアウト</button>
      </div>
    </div>
  </header>
  <main class="admin-main">
    <section class="admin-page-title admin-page-title--center"><div><span class="eyebrow" aria-hidden="true"></span><h1>アンケート配点ロジック</h1><p class="portal-hero-copy">質問ごとの回答配点を調整し、香りの5軸への反映を管理します。</p><p class="portal-hero-copy admin-reference-hidden-copy">active version <strong id="active-version">-</strong> / note <strong id="active-note">-</strong> / updated <strong id="active-updated">-</strong></p></div></section>
    <p class="status-note admin-reference-hidden-live" id="scoring-status">読み込み中です。</p><input id="scoring-import-json" type="file" accept="application/json" hidden>
    <section class="admin-scoring-reference-workbench">
      <aside class="admin-panel admin-reference-card admin-scoring-question-list">
        <h2>質問一覧</h2>
        <div class="admin-scoring-question-tabs" role="tablist" aria-label="設問ステップ切り替え">
          <button class="is-active" type="button" data-question-step-tab="step1" role="tab" aria-selected="true">STEP1</button>
          <button type="button" data-question-step-tab="step2" role="tab" aria-selected="false">STEP2</button>
        </div>
        <div class="admin-scoring-branch-tabs" id="scoring-branch-tabs" role="tablist" aria-label="STEP2分岐切り替え" hidden>
          <button class="is-active" type="button" data-question-branch-tab="floral" role="tab" aria-selected="true">Floral</button>
          <button type="button" data-question-branch-tab="fresh" role="tab" aria-selected="false">Fresh</button>
          <button type="button" data-question-branch-tab="woody" role="tab" aria-selected="false">Woody</button>
        </div>
        <nav id="scoring-question-list" aria-label="質問一覧"></nav>
        <p class="admin-reference-help">STEPを切り替えて、編集対象の設問へ移動できます。</p>
      </aside>
      <form class="admin-panel admin-reference-card admin-scoring-editor-card" id="scoring-form">
        <div class="admin-reference-card-head"><h2>質問編集</h2><div class="admin-scoring-status-pills"><span>公開中</span><span>下書き保存あり</span></div></div>
        <div class="admin-scoring-live-editor">
          <div id="scoring-branch-settings"></div>
          <div class="admin-form-stack" id="scoring-step1-section"></div>
          <div class="admin-form-stack" id="scoring-q8-section"></div>
          <div class="admin-form-stack" id="scoring-step2-section"></div>
          <div class="admin-form-stack" id="scoring-finish-section"></div>
        </div>
        <div class="admin-reference-hidden-live">
          <label>note<input id="scoring-note" type="text"></label>
          <textarea id="scoring-json" rows="10" readonly></textarea>
          <div class="portal-config-grid" id="scoring-sections"></div>
          <button class="admin-btn secondary" id="scoring-load-template" type="button">初期テンプレート</button>
          <button class="admin-btn secondary" id="scoring-load-active" type="button">activeへ戻す</button>
        </div>
      </form>
    </section>
    <section class="admin-panel admin-reference-bottom-strip">
      <div class="admin-scoring-bottom-group admin-scoring-bottom-group--database">
        <button class="admin-btn gold" type="submit" form="scoring-form">保存</button>
        <p>データベースに保存する場合は左の保存ボタンを押してください</p>
      </div>
      <div class="admin-scoring-bottom-group admin-scoring-bottom-group--local">
        <p>ローカルに保存する場合は右のJSON保存を押してください</p>
        <div class="admin-scoring-bottom-actions">
          <button class="admin-btn secondary" data-scoring-export type="button">JSON保存</button>
          <button class="admin-btn secondary" data-scoring-import-trigger type="button">JSON読込</button>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-data.js"></script>
  <script src="../js/fragrance-master-data.js"></script>
  <script src="../js/admin-scoring-page.js"></script>
</body>
</html>
