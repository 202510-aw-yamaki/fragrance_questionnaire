<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品予約 | Fragrance Workshop</title>
  <meta name="description" content="QRコードから遷移した香り商品の5軸情報を確認できるページです。">
  <style>
    /* css/common.css */
* {
  box-sizing: border-box;
}

.site-container {
  width: var(--container);
  margin: 0 auto;
}

.page-canvas {
  margin: 0;
  min-width: 360px;
  min-height: 100vh;
  color: var(--text);
  line-height: 1.7;
  letter-spacing: 0.02em;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  backdrop-filter: blur(14px);
  background: rgba(252, 248, 243, 0.82);
  border-bottom: 1px solid rgba(230, 221, 210, 0.88);
}

.page-header-inner {
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
  font-weight: 800;
  letter-spacing: 0.05em;
  white-space: nowrap;
  color: inherit;
}

.brand picture {
  display: block;
}

.brand img {
  width: auto;
  height: auto;
  max-height: 48px;
  max-width: 100%;
}

.header-inner {
  color: var(--text);
}

.header-cta {
  width: auto;
  flex: 0 0 auto;
  white-space: nowrap;
}

@media (max-width: 47.9375em) {
  .page-header-inner {
    min-height: auto;
    padding: 10px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
  }

  .header-top {
    flex: 0 0 auto;
    min-width: 0;
  }

  .brand {
    font-size: .95rem;
    min-width: 0;
  }

  .page-header-inner > .main-nav {
    width: 100%;
  }

  .page-header-inner > .header-actions {
    width: auto;
    min-width: 0;
    margin-left: auto;
  }

  .page-header-inner > .header-cta {
    width: 100%;
  }
}

.page-body {
  display: grid;
  gap: 14px;
}

.page-body > * {
  min-width: 0;
}

.page-main,
.page-panel,
.page-section-inner {
  min-width: 0;
}

.page-panel {
  display: block;
  min-height: 0;
}

.page-section {
  display: block;
  min-width: 0;
}

.section-header {
  display: grid;
  gap: 8px;
}

.section-header h1,
.section-header h2 {
  margin: 0;
  line-height: 1.2;
}

.section-header p {
  margin: 0;
  color: var(--muted);
}

.overline {
  display: block;
  color: var(--muted);
  font-size: 0.82rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.eyebrow,
.section-label {
  display: inline-flex;
  align-items: center;
  justify-self: start;
  min-height: 32px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.eyebrow {
  background: rgba(200, 137, 114, 0.14);
  color: var(--accent-deep);
}

.section-label {
  color: #9b7364;
}

.glass-panel {
  border: 1px solid rgba(201, 174, 155, 0.65);
  background: var(--panel);
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
  border-radius: var(--radius-lg);
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 999px;
  background: #f6eee8;
  color: #855644;
  font-size: 14px;
  font-weight: 700;
}

.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1px solid transparent;
  text-decoration: none;
  font-weight: 700;
  cursor: pointer;
  font: inherit;
  transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}

.btn:hover,
.btn:focus-visible {
  transform: translateY(-1px);
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #dfb8a6);
  border-color: #c58975;
  color: #fffdfb;
  box-shadow: 0 12px 24px rgba(130, 83, 53, 0.16);
}

.btn-secondary {
  border-color: var(--line);
  background: rgba(255, 255, 255, 0.84);
  color: var(--text);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

    /* css/fragrance-graph.css */
:root {
  --bg: #fcf8f3;
  --line: #e6ddd2;
  --text: #2f2925;
  --muted: #6f665f;
  --accent: #ba8155;
  --accent-deep: #9c6740;
  --shadow: 0 16px 34px rgba(80, 63, 48, .14);
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --container: min(1160px, calc(100% - 32px));
}

html {
  min-width: 360px;
  scroll-behavior: smooth;
  scroll-padding-top: 88px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(239, 219, 199, .58), transparent 28%),
    radial-gradient(circle at top right, rgba(222, 233, 222, .58), transparent 30%),
    linear-gradient(180deg, #f9f4ed 0%, #fcf8f3 34%, #fffdf9 100%);
}

a {
  color: inherit;
}

img,
svg {
  display: block;
  max-width: 100%;
}

.header-note {
  color: var(--muted);
  font-size: .92rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.header-cta {
  min-height: 40px;
  padding: 0 16px;
}

.btn {
  max-width: 100%;
}

.btn-primary {
  background: linear-gradient(180deg, var(--accent), var(--accent-deep));
  color: #fff;
  box-shadow: 0 10px 22px rgba(156, 103, 64, .24);
}

.btn-secondary {
  background: rgba(255, 255, 255, .8);
  border-color: var(--line);
  color: var(--text);
}

main section {
  padding: 68px 0;
}

.section-header {
  margin-bottom: 24px;
  max-width: 860px;
}

.section-header h1,
.section-header h2 {
  font-size: clamp(1.8rem, 3.2vw, 2.9rem);
}

.graph-layout .section-header h2 {
  font-size: clamp(1rem, 2.2vw, 1.8rem);
  line-height: 1.15;
  letter-spacing: -.02em;
  white-space: normal;
  overflow-wrap: anywhere;
}

.card,
.graph-card,
.reassure-card,
.cta-box {
  background: rgba(255, 255, 255, .94);
  border: 1px solid rgba(230, 221, 210, .92);
  border-radius: var(--radius-lg);
  box-shadow: 0 12px 24px rgba(80, 63, 48, .08);
  overflow: hidden;
  background-clip: padding-box;
}

.graph-layout,
.helper-grid,
.cta-box {
  display: grid;
  gap: 16px;
  grid-template-columns: 1fr;
}

.graph-intro .section-inner {
  display: grid;
  gap: 24px;
}

.hero-note {
  max-width: 860px;
  margin-top: 18px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: rgba(248, 242, 235, .85);
  color: var(--muted);
  font-size: .95rem;
}

.summary-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 10px;
  max-width: 720px;
}

.summary-list li {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(230, 221, 210, .78);
}

.summary-list li:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}

.graph-card,
.slider-card {
  padding: 24px;
}

.graph-card {
  display: grid;
  gap: 18px;
  align-content: start;
  min-width: 0;
}

.graph-card > * {
  min-width: 0;
}

.graph-frame {
  width: min(100%, 392px);
  justify-self: center;
  display: grid;
  place-items: center;
  padding: 16px;
  border-radius: var(--radius-md);
  background: linear-gradient(180deg, rgba(255, 255, 255, .88), rgba(244, 238, 232, .8));
  border: 1px solid var(--line);
  overflow: hidden;
}

#radar-graph {
  display: block;
  width: min(100%, 340px);
  height: auto;
}

.graph-caption {
  margin: 0;
  color: var(--muted);
  font-size: .94rem;
}

.slider-card {
  display: grid;
  gap: 14px;
  align-content: start;
}

.slider-row {
  display: grid;
  gap: 8px;
  padding: 14px 16px;
  border: 1px solid rgba(230, 221, 210, .92);
  border-radius: var(--radius-md);
  background: rgba(255, 253, 249, .92);
}

.slider-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
}

.slider-title {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
  flex-wrap: wrap;
}

.slider-head label {
  font-weight: 700;
}

.slider-detail {
  margin: 0;
  color: var(--muted);
  font-size: .92rem;
}

.slider-head output {
  min-width: 2.5em;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--accent-deep);
  font-weight: 700;
}

input[type="range"] {
  width: 100%;
  margin: 0 0 4px;
  accent-color: var(--accent);
}

.slider-actions {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  padding-top: 4px;
}

.ghost-btn {
  min-height: 42px;
  width: 100%;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .72);
  color: var(--text);
  padding: 0 8px;
  cursor: pointer;
  font: inherit;
  font-size: clamp(.62rem, 1.7vw, .92rem);
  white-space: nowrap;
}

.ghost-btn:hover,
.ghost-btn:focus-visible {
  border-color: rgba(156, 103, 64, .42);
}

.helper-grid {
  display: grid;
  gap: 16px;
  align-items: stretch;
}

.reassure-card {
  padding: 24px;
}

.reassure-card h3 {
  margin: 0 0 10px;
  font-size: 1.15rem;
}

.reassure-card p {
  margin: 0;
  color: var(--muted);
}

.graph-placeholder-image {
  width: 100%;
  height: auto;
  border-radius: 0;
  object-fit: cover;
}

.cta-box > .reassure-card {
  padding: 0;
}

.cta-box {
  padding: 28px;
  align-items: center;
}

.cta-copy h2 {
  margin: 10px 0 12px;
  font-size: clamp(1.6rem, 3vw, 2.4rem);
  line-height: 1.2;
}

.cta-copy p {
  margin: 0 0 18px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.cta-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: stretch;
}

.cta-actions .btn {
  width: fit-content;
  min-width: clamp(220px, 24vw, 300px);
  max-width: 100%;
}

.helper-note {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: .92rem;
}

.site-footer {
  padding: 22px 0 36px;
  color: var(--muted);
  font-size: .92rem;
}

.footer-inner {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  border-top: 1px solid rgba(230, 221, 210, .92);
  padding-top: 18px;
}

.footer-inner p {
  margin: 0;
}

@media (min-width: 68.75em) {

  html,
  body {
    height: 100%;
    overflow: hidden;
  }

  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
  }

  main {
    width: var(--container);
    margin: 0 auto;
    height: min(calc(100vh - 124px), 900px);
    display: grid;
    grid-template-rows: minmax(0, 73fr) minmax(0, 27fr);
    gap: 18px;
    padding: 14px 0;
  }

  main section {
    padding: 0;
    min-height: 0;
    overflow: hidden;
  }

  main > section > .section-inner {
    width: 100%;
    max-width: none;
    margin: 0;
    height: 100%;
    min-height: 0;
  }

  .graph-intro .section-inner {
    display: grid;
    align-content: start;
    gap: 12px;
  }

  .helper-grid {
    grid-template-columns: 1fr;
    height: 100%;
    gap: 10px;
  }

  .graph-layout {
    min-height: 0;
    grid-template-columns: minmax(220px, .84fr) minmax(300px, 1fr) minmax(160px, .58fr);
    align-items: stretch;
    height: 100%;
    gap: 14px;
  }

  .cta-box {
    grid-template-columns: 1fr 1fr;
    height: 100%;
    padding: 18px 22px;
    gap: 18px;
    align-items: stretch;
  }

  .section-header {
    margin-bottom: 12px;
    gap: 6px;
  }

  .section-header h1,
  .section-header h2 {
    font-size: clamp(1.5rem, 2.1vw, 2.1rem);
  }

  .section-header p,
  .graph-caption,
  .reassure-card p,
  .cta-copy p,
  .helper-note,
  .hero-note,
  .summary-list {
    font-size: .88rem;
  }

  .hero-note {
    margin-top: 0;
    padding: 10px 14px;
  }

  .summary-list {
    gap: 6px;
    max-width: 100%;
  }

  .summary-list li {
    padding-bottom: 6px;
  }

  .graph-card,
  .slider-card,
  .reassure-card {
    height: 100%;
    padding: 18px;
    overflow: hidden;
  }

  .graph-card {
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 12px;
  }

  .graph-frame {
    width: min(100%, 376px);
    padding: 12px;
  }

  #radar-graph {
    width: min(100%, 340px);
    height: auto;
    margin: 0;
  }

  .slider-card {
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 10px;
  }

  #slider-list {
    display: grid;
    min-height: 0;
    grid-template-rows: repeat(5, minmax(0, 1fr));
    gap: 6px;
  }

  .slider-row {
    padding: 8px 10px;
    gap: 4px;
  }

  .slider-head label,
  .slider-head output,
  .slider-detail {
    font-size: .92rem;
  }

  .slider-actions {
    gap: 8px;
    padding-top: 0;
  }

  .ghost-btn {
    min-height: 38px;
    font-size: clamp(.62rem, .95vw, .88rem);
  }

  .reassure-card {
    display: grid;
    align-content: start;
  }

  .helper-grid {
    grid-template-rows: repeat(3, minmax(0, 1fr));
    min-height: 0;
  }

  .helper-grid .reassure-card {
    min-height: 0;
  }

  .reassure-card h3 {
    margin-bottom: 8px;
    font-size: 1rem;
    line-height: 1.35;
  }

  .cta-copy {
    min-height: 0;
    display: grid;
    align-content: start;
    gap: 8px;
  }

  .cta-copy h2 {
    margin: 0;
    font-size: clamp(1.3rem, 1.9vw, 1.9rem);
  }

  .cta-copy p {
    margin: 0;
  }

  .cta-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .cta-actions .btn {
    min-height: 38px;
    width: fit-content;
    min-width: clamp(220px, 22vw, 280px);
  }

  .helper-note {
    margin: 0;
  }

  .cta-box > .reassure-card {
    min-height: 0;
    padding: 0;
    align-content: start;
  }

  .btn {
    min-height: 42px;
    padding: 0 16px;
  }

  .site-footer {
    padding: 10px 0 14px;
  }

  .footer-inner {
    padding-top: 10px;
  }
}

@media (min-width: 48em) and (max-width: 68.6875em) {
  main {
    width: var(--container);
    margin: 0 auto;
    padding: 14px 0 20px;
    display: grid;
    gap: 14px;
  }

  main section {
    padding: 0;
  }

  main > section > .section-inner {
    width: 100%;
    margin: 0;
  }

  .graph-layout {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: stretch;
  }

  .graph-card,
  .slider-card {
    height: 100%;
  }

  .helper-grid {
    display: none;
  }

  .slider-head output {
    display: none;
  }

  .cta-box {
    grid-template-columns: minmax(0, 1fr);
    align-items: stretch;
  }

  .cta-box > .reassure-card {
    display: none;
  }

  .cta-actions {
    display: flex;
    flex-wrap: wrap;
  }

  .cta-actions .btn {
    width: fit-content;
    min-width: clamp(220px, 34vw, 300px);
  }
}

@media (max-width: 47.9375em) {
  html {
    scroll-padding-top: 96px;
  }

  #graph-adjustment .section-header p {
    display: none;
  }

  #graph-adjustment {
    padding: 0;
  }

  .slider-head output {
    display: none;
  }

  .header-inner {
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .brand {
    min-width: 0;
  }

  .header-cta {
    width: auto;
    max-width: calc(100% - 88px);
    margin-left: auto;
    min-height: 38px;
    padding: 0 10px;
    font-size: .76rem;
    white-space: nowrap;
    flex: 0 1 auto;
  }

  main section {
    padding: 52px 0;
  }

  #cta {
    padding-bottom: 10px;
  }
  .section-inner,
  .footer-inner {
    width: min(1160px, calc(100% - 16px));
  }

  .graph-card,
  .slider-card,
  .reassure-card,
  .cta-box {
    padding: 20px;
  }

  .graph-layout,
  .helper-grid,
  .cta-box {
    grid-template-columns: 1fr;
  }

  .cta-actions {
    flex-direction: column;
  }

  .cta-actions .btn {
    width: 100%;
    min-width: 0;
  }

  .cta-box > .reassure-card {
    display: none;
  }
}

@media (min-width: 68.75em) and (max-height: 840px) {

  html,
  body {
    height: auto;
    overflow: auto;
  }

  body {
    display: block;
  }

  main {
    width: var(--container);
    margin: 0 auto;
    height: auto;
    display: grid;
    grid-template-rows: none;
    gap: 18px;
    padding: 14px 0 20px;
  }

  main section {
    padding: 0;
    overflow: visible;
  }

  main > section > .section-inner {
    height: auto;
  }

  .graph-layout {
    height: auto;
  }

  .graph-card,
  .slider-card,
  .reassure-card {
    height: auto;
    overflow: visible;
  }

  .slider-card {
    grid-template-rows: auto auto auto;
  }

  #slider-list {
    grid-template-rows: none;
  }
}

    /* css/product-reservation.css */
.product-reservation-page .product-header {
  justify-content: space-between;
}

.product-reservation-page .product-brand {
  color: #4c3a2d;
  font-size: clamp(1.1rem, 1rem + 0.35vw, 1.4rem);
  font-weight: 800;
  text-decoration: none;
  letter-spacing: 0.04em;
}

.product-reservation-page .product-layout {
  grid-template-columns: minmax(0, 1.08fr) minmax(21rem, 0.92fr);
  align-items: stretch;
}

.product-reservation-page .product-axis-stats {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  margin-top: 18px;
}

.product-reservation-page .product-axis-stat {
  display: grid;
  gap: 0.25rem;
  justify-items: center;
  padding: 12px 10px;
  border: 1px solid rgba(105, 88, 71, 0.12);
  border-radius: 14px;
  background: rgba(255, 252, 247, 0.92);
}

.product-reservation-page .product-axis-stat span {
  color: #8a7868;
  font-size: 13px;
}

.product-reservation-page .product-axis-stat strong {
  color: #6b4b34;
  font-size: 15px;
}

.product-reservation-page .product-cta-card {
  display: grid;
  align-content: start;
}

.product-reservation-page .product-meta-list {
  display: grid;
  gap: 12px;
  margin: 0 0 18px;
}

.product-reservation-page .product-meta-row {
  display: grid;
  gap: 0.2rem;
  padding: 14px 16px;
  border: 1px solid rgba(105, 88, 71, 0.1);
  border-radius: 16px;
  background: rgba(255, 252, 247, 0.92);
}

.product-reservation-page .product-meta-row span {
  color: #8a7868;
  font-size: 13px;
  font-weight: 700;
}

.product-reservation-page .product-meta-row strong {
  color: #4c3a2d;
  font-size: 16px;
}

.product-reservation-page .product-cta-actions {
