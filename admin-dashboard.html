<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理ダッシュボード | Fragrance Workshop</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin-common.css">
</head>
<body class="page-canvas admin-page">
  <header class="admin-header" id="admin-header"></header>
  <main class="admin-main site-container admin-grid">
    <section class="admin-panel">
      <p class="section-label">Dashboard</p>
      <h1>運用状況の確認</h1>
      <p class="admin-note">公開予約と設定の現在値をまとめて確認できます。</p>
    </section>
    <section class="admin-grid cols-2">
      <article class="admin-panel admin-kpi"><span>今日以降の予約件数</span><strong id="kpi-reservations">-</strong></article>
      <article class="admin-panel admin-kpi"><span>公開中の予約枠</span><strong id="kpi-slots">-</strong></article>
      <article class="admin-panel admin-kpi"><span>active scoring config version</span><strong id="kpi-scoring">-</strong></article>
      <article class="admin-panel admin-kpi"><span>原料ポイント件数</span><strong id="kpi-materials">-</strong></article>
    </section>
    <section class="admin-grid cols-3">
      <a class="admin-panel" href="admin-reservations.html"><h2>予約情報</h2><p class="admin-note">予約一覧と status 更新を行います。</p></a>
      <a class="admin-panel" href="admin-slots.html"><h2>予約枠管理</h2><p class="admin-note">予約枠の作成、編集、非表示化を行います。</p></a>
      <a class="admin-panel" href="admin-scoring.html"><h2>配点ロジック</h2><p class="admin-note">active config を確認し、新 version を追加します。</p></a>
      <a class="admin-panel" href="admin-materials.html"><h2>原料ポイント</h2><p class="admin-note">5軸ポイントを個別入力で管理します。</p></a>
      <a class="admin-panel" href="admin-settings.html"><h2>その他設定</h2><p class="admin-note">店舗情報や注意文言の保存先です。</p></a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-data.js"></script>
  <script>
    async function bootstrap() {
      window.AdminAuth.renderAdminHeader("dashboard");
      const session = await window.AdminAuth.requireAdminSession();
      if (!session) return;
      if (!window.AdminAuth.isConfigured()) return;
      const [reservations, slots, scoring, materials] = await Promise.all([
        window.AdminData.listRows("reservations", { orders: [{ column: "created_at", ascending: false }] }).catch(() => []),
        window.AdminData.listRows("reservation_slots", { filters: [{ operator: "in", column: "status", value: ["open", "recommended"] }] }).catch(() => []),
        window.AdminData.listRows("scoring_configs", { filters: [{ operator: "eq", column: "is_active", value: true }], limit: 1 }).catch(() => []),
        window.AdminData.listRows("material_points").catch(() => [])
      ]);
      document.getElementById("kpi-reservations").textContent = reservations.length;
      document.getElementById("kpi-slots").textContent = slots.length;
      document.getElementById("kpi-scoring").textContent = scoring[0]?.version ?? "-";
      document.getElementById("kpi-materials").textContent = materials.length;
    }
    bootstrap();
  </script>
</body>
</html>
