<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スタッフ・管理者ログイン | Fragrance Workshop</title>
  <link rel="stylesheet" href="css/rebuild-ui.css">
</head>
<body data-page="admin-login">
  <main class="page-hero">
    <div class="page-shell page-hero-inner">
      <section>
        <a class="brand" href="index.html"><span class="brand-mark">✦</span><span>Fragrance Workshop</span></a>
        <h1>スタッフ・管理者ログイン</h1>
        <p class="page-copy">スタッフ・管理者用のログイン画面です。</p>
      </section>
      <section class="login-panel">
        <p class="admin-error" id="config-error" hidden>Supabase 設定が未完了です。js/supabase-config.js を設定してください。</p>
        <p class="admin-error" id="login-error" hidden></p>
        <div class="action-row" role="tablist">
          <button class="portal-login-tab btn secondary is-active" id="staff-login-tab" type="button" role="tab" aria-selected="true" aria-controls="staff-login-panel" data-login-tab="staff">スタッフログイン</button>
          <button class="portal-login-tab btn secondary" id="manager-login-tab" type="button" role="tab" aria-selected="false" aria-controls="manager-login-panel" data-login-tab="manager">管理者ログイン</button>
        </div>
        <section id="staff-login-panel" role="tabpanel" aria-labelledby="staff-login-tab">
          <form class="login-form" data-login-role="staff">
            <label>ログインID<input data-login-field="identifier" type="text" autocomplete="username" required></label>
            <label>パスワード<input data-login-field="password" type="password" autocomplete="current-password" required></label>
            <button class="btn primary" type="submit">ログイン</button>
          </form>
        </section>
        <section id="manager-login-panel" role="tabpanel" aria-labelledby="manager-login-tab" hidden>
          <form class="login-form" data-login-role="manager">
            <label>ログインID<input data-login-field="identifier" type="text" autocomplete="username" required></label>
            <label>パスワード<input data-login-field="password" type="password" autocomplete="current-password" required></label>
            <button class="btn gold" type="submit">ログイン</button>
          </form>
        </section>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-login-page.js"></script>
</body>
</html>
