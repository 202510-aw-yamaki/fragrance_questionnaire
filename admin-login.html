<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理ログイン | Fragrance Workshop</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin-common.css">
</head>
<body class="page-canvas admin-page">
  <main class="admin-main site-container portal-login-main">
    <section class="portal-login-shell">
      <p class="admin-error" id="config-error" hidden>Supabase 設定が未完了です。`js/supabase-config.js` を設定してください。</p>
      <p class="admin-error" id="login-error" hidden></p>
      <div class="portal-login-grid">
        <section class="portal-login-panel portal-login-panel--staff">
          <p class="portal-hero-label">STAFF LOGIN</p>
          <h1>スタッフ画面へログイン</h1>
          <p class="admin-note">担当スタッフの確認ページ、予約枠作成、予約情報一覧へ進みます。</p>
          <form class="admin-form portal-login-form" data-login-role="staff">
            <label>スタッフID
              <input data-login-field="email" type="email" autocomplete="email" placeholder="staff@example.com" required>
            </label>
            <label>パスワード
              <input data-login-field="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="admin-btn primary portal-login-button" type="submit">ログイン</button>
          </form>
        </section>

        <section class="portal-login-panel portal-login-panel--manager">
          <p class="portal-hero-label">ADMIN LOGIN</p>
          <h1>管理者画面へログイン</h1>
          <p class="admin-note">管理スタッフ確認ページ、配点ロジック、原料ポイントなどの管理画面へ進みます。</p>
          <form class="admin-form portal-login-form" data-login-role="manager">
            <label>管理者ID
              <input data-login-field="email" type="email" autocomplete="email" placeholder="manager@example.com" required>
            </label>
            <label>パスワード
              <input data-login-field="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="admin-btn primary portal-login-button" type="submit">ログイン</button>
          </form>
        </section>
      </div>
      <div class="admin-actions portal-login-actions">
        <a class="admin-btn secondary" href="index.html">公開サイトへ戻る</a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
  <script>
    const errorEl = document.getElementById("login-error");
    const configErrorEl = document.getElementById("config-error");
    const loginForms = Array.from(document.querySelectorAll("[data-login-role]"));

    async function bootstrap() {
      if (!window.AdminAuth.isConfigured()) {
        configErrorEl.hidden = false;
        loginForms.forEach((currentForm) => {
          currentForm.querySelector("button[type='submit']").disabled = true;
        });
        return;
      }
      const session = await window.AdminAuth.getSession();
      if (session) {
        const preferredRole = window.AdminAuth.readRoleFromLocation() || window.AdminAuth.readStoredRole() || "manager";
        window.AdminAuth.redirectToRoleHome(window.AdminAuth.resolvePortalRole(session, preferredRole));
      }
    }

    loginForms.forEach((currentForm) => {
      currentForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.hidden = true;
        const role = currentForm.dataset.loginRole || "manager";
        const emailInput = currentForm.querySelector('[data-login-field="email"]');
        const passwordInput = currentForm.querySelector('[data-login-field="password"]');
        try {
          await window.AdminAuth.signInAdmin(emailInput.value.trim(), passwordInput.value);
          window.AdminAuth.persistPortalRole(role);
          window.AdminAuth.redirectToRoleHome(role);
        } catch (error) {
          errorEl.textContent = error.message || "ログインに失敗しました。";
          errorEl.hidden = false;
        }
      });
    });

    bootstrap();
  </script>
</body>
</html>
